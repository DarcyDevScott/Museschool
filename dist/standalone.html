<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museschool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Museschool — one stylesheet.
   The page is a logbook: ruled rather than carded, with the data set in a
   monospace so day counts, scores and deltas line up in columns.

   Light is defined on bare :root; dark redefines only the tokens, guarded so
   an explicit light choice always beats a dark system preference. */

:root {
  --ground: #E8EAE6;
  --surface: #F6F7F4;
  --surface-2: #DFE3DD;
  --ink: #13181A;
  --ink-2: #4C5457;
  --ink-3: #828A8B;
  --rule: #CFD5CF;
  --rule-2: #B4BCB4;
  --accent: #12544A;
  --accent-ink: #F6F7F4;
  --accent-soft: #D8E3DF;
  --signal: #96650F;
  --signal-soft: #EDE2CB;
  --good: #2F6B4A;
  --radius: 3px;
  --display: "Spectral", ui-serif, Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101413;
    --surface: #171C1B;
    --surface-2: #212827;
    --ink: #E6EAE6;
    --ink-2: #A6AFAD;
    --ink-3: #77817F;
    --rule: #262E2C;
    --rule-2: #364240;
    --accent: #5FA99B;
    --accent-ink: #0C110F;
    --accent-soft: #172825;
    --signal: #C79A3E;
    --signal-soft: #271F10;
    --good: #6FB088;
  }
}

:root[data-theme="dark"] {
  --ground: #101413;
  --surface: #171C1B;
  --surface-2: #212827;
  --ink: #E6EAE6;
  --ink-2: #A6AFAD;
  --ink-3: #77817F;
  --rule: #262E2C;
  --rule-2: #364240;
  --accent: #5FA99B;
  --accent-ink: #0C110F;
  --accent-soft: #172825;
  --signal: #C79A3E;
  --signal-soft: #271F10;
  --good: #6FB088;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 92px;
}

h1, h2, h3 {
  font-family: var(--display);
  font-weight: 600;
  line-height: 1.15;
  margin: 0;
  letter-spacing: -0.012em;
  text-wrap: balance;
}
h1 { font-size: clamp(1.95rem, 5.2vw, 2.7rem); }
h2 { font-size: clamp(1.35rem, 3.6vw, 1.75rem); }
h3 { font-size: 1.05rem; }
p { margin: 0 0 1em; }
a { color: var(--accent); }

.wrap { max-width: 660px; margin: 0 auto; padding: 26px 20px 48px; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.small { font-size: .875rem; }
.tiny { font-size: .76rem; }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 0; }
.row { display: flex; gap: 10px; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.hide { display: none !important; }
.scroll-x { overflow-x: auto; }

/* Uppercase mono micro-label — the logbook's field headings. */
.eyebrow {
  font-family: var(--mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  font-weight: 500;
  color: var(--ink-3);
}

/* ---------- ruled blocks, not floating cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.card + .card { margin-top: -1px; }   /* rules meet rather than double up */
.card-tight { padding: 15px 18px; }

/* ---------- buttons ---------- */
button { font: inherit; cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--mono);
  font-size: .8rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: .09em;
  transition: opacity .12s ease;
}
.btn:hover { opacity: .88; }
.btn[disabled] { opacity: .34; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-2); }
.btn-quiet { background: transparent; color: var(--ink-3); border-color: transparent; padding: 12px 10px; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 10px; align-items: center; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* ---------- quiz ---------- */
.progressbar { height: 2px; background: var(--rule); overflow: hidden; }
.progressbar > i { display: block; height: 100%; background: var(--accent); transition: width .35s ease; }

.q { margin: 30px 0; }
.q-text { font-family: var(--display); font-size: 1.22rem; line-height: 1.32; margin-bottom: 14px; }
.q-note {
  font-family: var(--mono); font-size: .72rem; letter-spacing: .06em;
  color: var(--ink-3); margin: -8px 0 12px;
}

.opt {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 13px 15px; margin-bottom: -1px;
  color: var(--ink); position: relative;
  transition: background .12s ease, border-color .12s ease;
}
.opt:hover { border-color: var(--rule-2); z-index: 1; }
.opt[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft); z-index: 2;
}
.opt-label { font-weight: 500; }
.opt-note { display: block; color: var(--ink-3); font-size: .83rem; margin-top: 1px; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
.scale button {
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2);
  border-radius: 0; padding: 12px 3px 9px; text-align: center;
  margin-right: -1px; position: relative;
  transition: background .12s ease, border-color .12s ease;
}
.scale button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.scale button:last-child { border-radius: 0 var(--radius) var(--radius) 0; margin-right: 0; }
.scale button:hover { border-color: var(--rule-2); z-index: 1; }
.scale button[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft); color: var(--ink); z-index: 2;
}
.scale b {
  display: block; font-family: var(--mono); font-weight: 500;
  font-size: 1rem; font-variant-numeric: tabular-nums;
}
.scale span { display: block; font-size: .62rem; line-height: 1.25; margin-top: 3px; color: var(--ink-3); }

input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 12px 14px; resize: vertical;
}
input[type="text"]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { min-height: 118px; line-height: 1.55; }

/* ---------- the day's entries ---------- */
.task {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 15px 17px; margin-bottom: -1px;
  position: relative;
  transition: opacity .18s ease;
}
.task:hover { z-index: 1; }
.task.done { opacity: .5; }
.task.done .task-title { text-decoration: line-through; text-decoration-thickness: 1px; }
.tick {
  flex: 0 0 22px; width: 22px; height: 22px; margin-top: 3px;
  border-radius: var(--radius); border: 1px solid var(--rule-2);
  background: transparent; color: transparent;
  display: grid; place-items: center; font-size: .72rem; line-height: 1;
  transition: all .15s ease;
}
.tick:hover { border-color: var(--accent); }
.task.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task-body { flex: 1; min-width: 0; }
.task-title { font-weight: 600; font-size: 1rem; }
.task-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 5px; }
.chip {
  font-family: var(--mono); font-size: .64rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: .11em;
  color: var(--ink-3);
}
.chip-anchor { color: var(--signal); }
.chip-reflect { color: var(--accent); }
.task-detail { color: var(--ink-2); font-size: .9rem; margin-top: 5px; }
.task-journal { margin-top: 12px; }
.saved { color: var(--good); font-size: .76rem; }

/* ---------- measurements ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.stat {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 14px 10px; text-align: center;
  margin-right: -1px;
}
.stat:last-child { margin-right: 0; }
.stat b {
  display: block; font-family: var(--mono); font-weight: 500;
  font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.stat span {
  font-family: var(--mono); font-size: .62rem; text-transform: uppercase;
  letter-spacing: .1em; color: var(--ink-3);
}

.bars { display: grid; gap: 0; }
.bar-row {
  display: grid; grid-template-columns: 112px 1fr 46px; gap: 12px;
  align-items: center; font-size: .84rem;
  padding: 7px 0; border-bottom: 1px solid var(--rule);
}
.bar-row:last-child { border-bottom: 0; }
.bar { height: 6px; background: var(--surface-2); position: relative; border-radius: 1px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 1px; transition: width .5s ease; }
.bar > u {
  position: absolute; top: -3px; width: 1px; height: 12px;
  background: var(--ink-3);
}
.bar-val {
  text-align: right; color: var(--ink-2);
  font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums;
}
.bar-key { color: var(--ink-2); }
.bar-row.key .bar-key { color: var(--ink); font-weight: 600; }
.bar-row.key .bar > i { background: var(--signal); }

/* ---------- the arc ---------- */
.phase { border-left: 1px solid var(--rule-2); padding: 0 0 24px 20px; position: relative; }
.phase:last-child { padding-bottom: 0; }
.phase::before {
  content: ""; position: absolute; left: -4px; top: 6px;
  width: 7px; height: 7px;
  background: var(--ground); border: 1px solid var(--rule-2);
}
.phase.now { border-left-color: var(--signal); }
.phase.now::before { background: var(--signal); border-color: var(--signal); }
.phase.past::before { background: var(--rule-2); }
.phase h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.phase h3 .dim {
  font-family: var(--mono); font-size: .68rem !important;
  text-transform: uppercase; letter-spacing: .1em;
}
.ms { list-style: none; padding: 0; margin: 12px 0 0; }
.ms li {
  position: relative; padding-left: 18px; margin-bottom: 6px;
  font-size: .88rem; color: var(--ink-2);
}
.ms li::before { content: "·"; position: absolute; left: 4px; color: var(--rule-2); font-weight: 700; }

/* ---------- navigation ---------- */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: center; gap: 0;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
}
.nav button {
  flex: 1; max-width: 116px; background: none; border: 0;
  color: var(--ink-3); padding: 6px 4px; border-radius: var(--radius);
  font-family: var(--mono); font-size: .63rem;
  text-transform: uppercase; letter-spacing: .1em; font-weight: 500;
}
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav i { display: block; font-size: 1rem; font-style: normal; margin-bottom: 2px; }

/* ---------- misc ---------- */
.note {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 2px solid var(--signal);
  border-radius: var(--radius);
  padding: 15px 17px; font-size: .88rem; color: var(--ink-2);
}
.note strong { color: var(--ink); }
.divider { height: 1px; background: var(--rule); margin: 30px 0; border: 0; }
.jentry { border-bottom: 1px solid var(--rule); padding: 15px 0; }
.jentry:last-child { border-bottom: 0; }
.jentry pre { white-space: pre-wrap; font: inherit; margin: 5px 0 0; color: var(--ink-2); }
.jentry .tiny {
  font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em;
}

.toast {
  position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(6px);
  background: var(--ink); color: var(--ground);
  padding: 9px 16px; border-radius: var(--radius);
  font-family: var(--mono); font-size: .72rem;
  text-transform: uppercase; letter-spacing: .1em;
  opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 40;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 720px) {
  body { padding-bottom: 40px; }
  .nav {
    position: sticky; top: 0; bottom: auto;
    border-top: 0; border-bottom: 1px solid var(--rule);
    padding: 9px 8px; gap: 2px;
  }
  .nav i { display: none; }
  .nav button { padding: 8px 15px; max-width: none; flex: 0 0 auto; }
  .toast { bottom: 32px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ---- src/data/quiz.js ---- */
/* Museschool — onboarding quiz definition.
 *
 * Question types:
 *   text    free text (opt.placeholder, opt.optional)
 *   single  one choice from opt.options [{v,label,note?}]
 *   multi   many choices, opt.max caps the selection
 *   scale   1..5 agreement. opt.dim maps it to a profile dimension.
 *           opt.reverse means agreeing scores LOW on that dimension.
 *
 * `when` gates a section on earlier answers.
 */
(function (MS) {
  'use strict';

  // Agreement labels shared by every scale question.
  var AGREE = ['Not at all', 'Rarely', 'Sometimes', 'Often', 'Always'];

  function scale(id, dim, text, reverse) {
    return { id: id, type: 'scale', text: text, dim: dim, reverse: !!reverse, labels: AGREE };
  }

  var GOALS = [
    { v: 'relationship', label: 'Repair or rebuild a relationship', note: 'Partner, ex-partner, or someone close' },
    { v: 'worth', label: 'Confidence and self-worth', note: 'Liking who you are without needing proof' },
    { v: 'regulation', label: 'Emotional steadiness', note: 'Feeling things without being run by them' },
    { v: 'consistency', label: 'Discipline and follow-through', note: 'Doing what you said you would' },
    { v: 'vitality', label: 'Body, sleep and energy', note: 'The physical base underneath everything' },
    { v: 'purpose', label: 'Direction and purpose', note: 'Knowing what you are building' },
    { v: 'connection', label: 'Friendship and community', note: 'A life that is not one person wide' },
    { v: 'presence', label: 'Presence and attention', note: 'Actually being where you are' }
  ];

  MS.GOALS = GOALS;

  MS.QUIZ = [
    {
      id: 'start',
      title: 'Where you are',
      blurb: 'No right answers here. The plan is only as good as how honest this is — and nothing you type leaves this device.',
      questions: [
        { id: 'name', type: 'text', short: true, text: 'What should this call you?', placeholder: 'First name' },
        { id: 'ageRange', type: 'single', text: 'How old are you?', options: [
          { v: 'u25', label: 'Under 25' }, { v: '25_34', label: '25–34' },
          { v: '35_44', label: '35–44' }, { v: '45_54', label: '45–54' },
          { v: '55p', label: '55 or older' }
        ]},
        { id: 'season', type: 'single', text: 'Which best describes the season you are in?', options: [
          { v: 'crisis', label: 'Something just broke', note: 'Recent, raw, still loud' },
          { v: 'drift', label: 'Slow drift', note: 'Nothing exploded, but I have lost the thread' },
          { v: 'stuck', label: 'Stuck in a loop', note: 'Same patterns, same outcomes' },
          { v: 'rebuild', label: 'Rebuilding', note: 'Past the worst, putting it back together' },
          { v: 'sharpen', label: 'Basically okay, want more', note: 'Stable, aiming higher' }
        ]},
        { id: 'prompt', type: 'single', text: 'What brought you here right now?', options: [
          { v: 'loss', label: 'I lost someone or something that mattered' },
          { v: 'pattern', label: 'I keep repeating something I hate' },
          { v: 'told', label: 'Someone told me the truth about myself' },
          { v: 'flat', label: 'I feel flat and I want to feel something' },
          { v: 'ready', label: 'Nothing is wrong. I just want to be better' }
        ]},
        { id: 'duration', type: 'single', text: 'How long has this been going on?', options: [
          { v: 'weeks', label: 'A few weeks' }, { v: 'months', label: 'A few months' },
          { v: 'year', label: 'About a year' }, { v: 'years', label: 'Years' },
          { v: 'always', label: 'As long as I can remember' }
        ]},
        { id: 'tried', type: 'single', text: 'Have you tried to work on this before?', options: [
          { v: 'never', label: 'Not really' },
          { v: 'started', label: 'I start and stop' },
          { v: 'therapy', label: 'Yes — therapy or coaching' },
          { v: 'alone', label: 'Yes — on my own, books and videos' },
          { v: 'lots', label: 'Many times. That is part of the problem' }
        ]}
      ]
    },

    {
      id: 'want',
      title: 'What you want',
      blurb: 'Aim at something specific. Vague goals produce vague plans.',
      questions: [
        { id: 'goals', type: 'multi', max: 3, text: 'What do you want to work on? Pick up to three.', options: GOALS },
        { id: 'primaryGoal', type: 'single', text: 'If only one of those could change this year, which one?', options: GOALS },
        { id: 'evidence', type: 'multi', max: 3, text: 'Six months from now, what would tell you this actually worked?', options: [
          { v: 'calm', label: 'I stayed calm in a moment that used to wreck me' },
          { v: 'kept', label: 'I kept a promise to myself for months straight' },
          { v: 'heard', label: 'Someone told me I had changed' },
          { v: 'alone_ok', label: 'I was alone and genuinely fine' },
          { v: 'repaired', label: 'A relationship got real again' },
          { v: 'proud', label: 'I looked at my week and felt proud of it' },
          { v: 'body', label: 'I felt strong and rested in my body' }
        ]},
        { id: 'feelMore', type: 'multi', max: 3, text: 'What do you want more of?', options: [
          { v: 'steady', label: 'Steadiness' }, { v: 'warmth', label: 'Warmth' },
          { v: 'respect', label: 'Self-respect' }, { v: 'energy', label: 'Energy' },
          { v: 'clarity', label: 'Clarity' }, { v: 'courage', label: 'Courage' },
          { v: 'peace', label: 'Peace' }, { v: 'joy', label: 'Joy' }
        ]},
        { id: 'giveUp', type: 'multi', max: 3, text: 'What are you actually willing to give up to get there?', options: [
          { v: 'scroll', label: 'Hours of scrolling' },
          { v: 'drink', label: 'Drinking to take the edge off' },
          { v: 'right', label: 'Being right in arguments' },
          { v: 'sleepin', label: 'Sleeping in' },
          { v: 'venting', label: 'Venting to anyone who will listen' },
          { v: 'checking', label: 'Checking what they are doing' },
          { v: 'story', label: 'The story where I am the one who got wronged' }
        ]}
      ]
    },

    {
      id: 'regulation',
      title: 'Emotional steadiness',
      blurb: 'How you handle the moment after something lands badly.',
      questions: [
        scale('reg1', 'regulation', 'When something upsets me, I can feel it without acting on it straight away.'),
        scale('reg2', 'regulation', 'I recover from a bad moment within the same day.'),
        scale('reg3', 'regulation', 'I say things I regret when I am hurt.', true),
        scale('reg4', 'regulation', 'I can name what I am feeling while I am feeling it.'),
        scale('reg5', 'regulation', 'Small frustrations escalate fast for me.', true),
        scale('reg6', 'regulation', 'I can settle myself down without needing someone else to do it for me.')
      ]
    },

    {
      id: 'worth',
      title: 'Self-worth',
      blurb: 'What you are like with yourself when nobody is watching.',
      questions: [
        scale('wor1', 'worth', 'I like who I am when I am on my own.'),
        scale('wor2', 'worth', 'I need reassurance from others to feel okay.', true),
        scale('wor3', 'worth', 'I speak to myself the way I would speak to a friend.'),
        scale('wor4', 'worth', 'I feel like I have to earn being loved.', true),
        scale('wor5', 'worth', 'I can be alone without feeling empty.')
      ]
    },

    {
      id: 'communication',
      title: 'How you communicate',
      blurb: 'Especially under pressure, which is the only time it counts.',
      questions: [
        scale('com1', 'communication', 'I can say what I need directly, without hinting.'),
        scale('com2', 'communication', 'I shut down or go silent during conflict.', true),
        scale('com3', 'communication', 'I listen to understand rather than to reply.'),
        scale('com4', 'communication', 'I can hear criticism without defending myself.'),
        scale('com5', 'communication', 'When I apologise I name the specific thing, with no "but" attached.')
      ]
    },

    {
      id: 'ownership',
      title: 'Ownership',
      blurb: 'The uncomfortable section. Take your time.',
      questions: [
        scale('own1', 'ownership', 'I can name my part in things going wrong.'),
        scale('own2', 'ownership', 'When I am hurt, I focus on what the other person did wrong.', true),
        scale('own3', 'ownership', 'I have genuinely changed a behaviour because someone told me it hurt them.'),
        scale('own4', 'ownership', 'I make excuses for patterns I know are mine.', true),
        scale('own5', 'ownership', 'I can be wrong about something without it meaning I am a bad person.')
      ]
    },

    {
      id: 'consistency',
      title: 'Follow-through',
      blurb: 'Whether your intentions survive contact with a Tuesday.',
      questions: [
        scale('con1', 'consistency', 'I do what I said I would, even when I do not feel like it.'),
        scale('con2', 'consistency', 'I abandon things about two weeks in.', true),

/* Museschool — task library.
 *
 * Every task: { id, cat, dim, phases, min, title, detail, tags? }
 *   cat     anchor   a keystone habit, repeated daily for a whole phase
 *           practice a skill drill, rotates day to day
 *           reflect  written work
 *           reach    an action pointed outward, at real people
 *   dim     the profile dimension it trains
 *   phases  which of the four phases it can appear in
 *   min     rough minutes
 *   tags    'relationship' tasks only surface for relationship-focused plans
 */
(function (MS) {
  'use strict';

  MS.TASKS = [

    /* ---------- ANCHORS: one per dimension, held for a full phase ---------- */
    { id: 'a_reg', cat: 'anchor', dim: 'regulation', phases: [1,2,3,4], min: 5,
      title: 'Ten slow breaths before the first screen',
      detail: 'Before you touch your phone, sit up and take ten breaths where the exhale is longer than the inhale. That is the whole thing. You are teaching your body that the day starts on your terms.' },
    { id: 'a_wor', cat: 'anchor', dim: 'worth', phases: [1,2,3,4], min: 5,
      title: 'One kept promise, written down',
      detail: 'Each morning name one small thing you will do today. Not a goal — a promise. Write it. Tick it tonight. Self-worth is built from evidence, and this is how you manufacture the evidence.' },
    { id: 'a_com', cat: 'anchor', dim: 'communication', phases: [1,2,3,4], min: 5,
      title: 'One sentence said plainly',
      detail: 'Once today, say something you would normally hint at, soften, or swallow. One clean sentence. "I would like…", "I did not like…", "I need…". Note what you said and what happened.' },
    { id: 'a_own', cat: 'anchor', dim: 'ownership', phases: [1,2,3,4], min: 5,
      title: 'The daily ledger',
      detail: 'At the end of the day write one line: something you did well, and something that was yours to own. No self-flagellation, no excuses. Just the record.' },
    { id: 'a_con', cat: 'anchor', dim: 'consistency', phases: [1,2,3,4], min: 10,
      title: 'The non-negotiable ten',
      detail: 'Ten minutes on the same thing at the same time, every day of this phase. Choose it once and do not renegotiate it daily — the negotiating is what kills it.' },
    { id: 'a_vit', cat: 'anchor', dim: 'vitality', phases: [1,2,3,4], min: 15,
      title: 'Get outside and move',
      detail: 'Fifteen minutes outdoors, moving, before noon if you can. Daylight and motion. This is not exercise, it is maintenance on the machine that runs everything else.' },
    { id: 'a_pur', cat: 'anchor', dim: 'purpose', phases: [1,2,3,4], min: 10,
      title: 'Ten minutes on the thing that is yours',
      detail: 'One project, skill or craft that belongs to you alone. Ten minutes daily. It does not have to go anywhere. It has to be yours.' },
    { id: 'a_cnn', cat: 'anchor', dim: 'connection', phases: [1,2,3,4], min: 5,
      title: 'Reach out first, once a day',
      detail: 'One message to one person that is not about you needing something. A question, a memory, a "thought of you". A life that is one person wide is fragile.' },
    { id: 'a_prs', cat: 'anchor', dim: 'presence', phases: [1,2,3,4], min: 5,
      title: 'Phone in another room for the first hour',
      detail: 'The first hour after you wake, the phone lives somewhere else. If you need an alarm, use an actual alarm. Notice what fills the gap.' },

    /* ---------- PRACTICE: regulation ---------- */
    { id: 'p_reg1', cat: 'practice', dim: 'regulation', phases: [1], min: 5,
      title: 'Name it to tame it',
      detail: 'Three times today, stop and name the feeling in one word — out loud or in a note. "Irritated." "Anxious." "Fine." Naming an emotion measurably lowers its grip. You are building the noticing muscle before you need it.' },
    { id: 'p_reg2', cat: 'practice', dim: 'regulation', phases: [1], min: 5,
      title: 'Find where it lives',
      detail: 'Next time something stings, locate it physically. Chest? Jaw? Gut? Stay with the sensation for sixty seconds without doing anything about it. Feelings that are felt move through. Feelings that are avoided stay.' },
    { id: 'p_reg3', cat: 'practice', dim: 'regulation', phases: [1,2], min: 10,
      title: 'The ninety-second rule',
      detail: 'The chemical wave of an emotion lasts about ninety seconds. Everything after that is you re-telling yourself the story. Today, when something lands, count ninety seconds before you respond to it. Just count.' },
    { id: 'p_reg4', cat: 'practice', dim: 'regulation', phases: [2], min: 10,
      title: 'Rehearse the hard moment',
      detail: 'Pick the scenario that reliably wrecks you. Play it in your head in detail — then rehearse yourself responding well. Twice through. You cannot improvise calm; you install it in advance.' },
    { id: 'p_reg5', cat: 'practice', dim: 'regulation', phases: [2,3], min: 5,
      title: 'The pause you actually take',
      detail: 'One time today when you feel the urge to react fast — reply, snap, defend, send — put it down for ten minutes. Ten minutes, then decide. Note whether the ten minutes changed what you did.' },
    { id: 'p_reg6', cat: 'practice', dim: 'regulation', phases: [2,3], min: 10,
      title: 'Cold reset',
      detail: 'Cold water on your face and wrists for thirty seconds, or a cold end to your shower. It reliably drops physical arousal. Use it once today, ideally at your known bad hour.' },
    { id: 'p_reg7', cat: 'practice', dim: 'regulation', phases: [3,4], min: 10,
      title: 'Sit in the discomfort on purpose',
      detail: 'Choose something mildly uncomfortable and do not fix it: the silence, the unanswered message, the boredom. Fifteen minutes. Every time you tolerate discomfort without discharging it, your capacity grows.' },
    { id: 'p_reg8', cat: 'practice', dim: 'regulation', phases: [3,4], min: 10,
      title: 'Trace it back',
      detail: 'Take one strong reaction from the last week and walk it backwards. What was the trigger, the story you told, the feeling, the action? Do it on paper. Patterns become obvious once they are written down.' },

    /* ---------- PRACTICE: worth ---------- */
    { id: 'p_wor1', cat: 'practice', dim: 'worth', phases: [1], min: 5,
      title: 'Catch the voice',
      detail: 'Write down, word for word, one thing you said to yourself today. Then write what you would say to a friend in the same position. Do not fix it, just put them side by side.' },
    { id: 'p_wor2', cat: 'practice', dim: 'worth', phases: [1], min: 10,
      title: 'The evidence file',
      detail: 'List five things you have done that were hard. Not achievements — hard things you did anyway. Keep the list. You will read it on a bad day.' },
    { id: 'p_wor3', cat: 'practice', dim: 'worth', phases: [1,2], min: 10,
      title: 'An hour alone, on purpose',
      detail: 'One hour with no phone, no company, no content. Walk, sit, cook, whatever. The goal is to find out whether your own company is tolerable — and to make it more so.' },
    { id: 'p_wor4', cat: 'practice', dim: 'worth', phases: [2], min: 5,
      title: 'Drop one apology',
      detail: 'Notice one place today where you apologise for existing — taking up time, asking a question, having a preference. Do not apologise. Say "thank you for waiting" instead of "sorry I am late" if you need a substitute.' },
    { id: 'p_wor5', cat: 'practice', dim: 'worth', phases: [2,3], min: 10,
      title: 'Do something well that nobody will see',
      detail: 'Make the bed properly. Cook a real meal for one. Finish the job to a standard nobody is checking. Self-respect is what you do when there is no audience.' },
    { id: 'p_wor6', cat: 'practice', dim: 'worth', phases: [3], min: 10,
      title: 'Accept a compliment without deflecting',
      detail: 'If one comes, say "thank you" and stop talking. No joke, no correction, no returning it immediately. Notice how strong the urge to deflect is.' },
    { id: 'p_wor7', cat: 'practice', dim: 'worth', phases: [3,4], min: 10,
      title: 'Name your terms',
      detail: 'Write three things you will not accept in a relationship or friendship again, and three you will always offer. Standards, not walls. Knowing them is what stops you negotiating yourself away.' },

    /* ---------- PRACTICE: communication ---------- */
    { id: 'p_com1', cat: 'practice', dim: 'communication', phases: [1], min: 5,
      title: 'Listen without preparing',
      detail: 'In one conversation today, do not think about your reply while they talk. When they finish, wait two seconds. That gap is where people feel heard.' },
    { id: 'p_com2', cat: 'practice', dim: 'communication', phases: [1,2], min: 5,
      title: 'Reflect it back',
      detail: 'Once today, before you respond to something someone said, say it back: "So what you are saying is…". Get it wrong and let them correct you. Being corrected is the point.' },
    { id: 'p_com3', cat: 'practice', dim: 'communication', phases: [2], min: 10,
      title: 'The unsent version, then the sent one',
      detail: 'Write the raw version of something you need to say. All of it. Then write the version you would actually send: what you feel, what you need, no diagnosis of them. Send only the second, if at all.' },
    { id: 'p_com4', cat: 'practice', dim: 'communication', phases: [2,3], min: 10,
      title: 'Ask one real question',
      detail: 'Ask someone something you do not already know the answer to, and that you cannot answer for them. Then let them talk for longer than is comfortable.' },
    { id: 'p_com5', cat: 'practice', dim: 'communication', phases: [2,3], min: 10,
      title: 'Apologise properly, once',
      detail: 'The format: name the specific thing, name its effect on them, no "but", no explanation of your intent, no request for forgiveness. "I did X. It made you feel Y. I am sorry." Then stop.' },
    { id: 'p_com6', cat: 'practice', dim: 'communication', phases: [3], min: 10,
      title: 'Take a criticism without defending',
      detail: 'If someone gives you feedback today, respond with one of: "tell me more", "you are right", or "let me think about that". Nothing else. The defence you skip is the trust you build.' },
    { id: 'p_com7', cat: 'practice', dim: 'communication', phases: [3,4], min: 10,
      title: 'Say the thing you have been avoiding',
      detail: 'There is one sentence you have not said to someone. Say it, calmly, without a build-up. Most avoided conversations are smaller out loud than they are in your head.' },
    { id: 'p_com8', cat: 'practice', dim: 'communication', phases: [4], min: 10,
      title: 'Hold a boundary kindly',
      detail: 'Say no to one thing without over-explaining. "I cannot do that" is a complete sentence. Warm tone, no negotiation, no five reasons.' },

    /* ---------- PRACTICE: ownership ---------- */
    { id: 'p_own1', cat: 'practice', dim: 'ownership', phases: [1], min: 10,
      title: 'Separate the fact from the story',
      detail: 'Take one grievance. Write two columns: what verifiably happened, and what you decided it meant. Most of the weight sits in the second column, and the second column is yours.' },
    { id: 'p_own2', cat: 'practice', dim: 'ownership', phases: [1,2], min: 10,
      title: 'Your ten per cent',
      detail: 'Take a conflict where you were mostly in the right. Find your ten per cent. Write it down without qualifying it. Owning ten per cent fully beats owning a hundred per cent theoretically.' },
    { id: 'p_own3', cat: 'practice', dim: 'ownership', phases: [2], min: 15,
      title: 'Write their side',
      detail: 'Write a page from the other person\'s point of view, in their voice, as sympathetically as you can manage. Not to agree with it. To be able to hold it.' },
    { id: 'p_own4', cat: 'practice', dim: 'ownership', phases: [2,3], min: 10,
      title: 'Catch one excuse in flight',

    { id: 'p_own5', cat: 'practice', dim: 'ownership', phases: [3], min: 10,
      title: 'The repeated note',

    { id: 'p_own6', cat: 'practice', dim: 'ownership', phases: [3,4], min: 10,
      title: 'Change one thing you were told about',
      detail: 'Pick one specific behaviour someone asked you to change. Change it today, visibly, without announcing it. Announced change is a request for credit. Quiet change is the real thing.' },

    /* ---------- PRACTICE: consistency ---------- */
    { id: 'p_con1', cat: 'practice', dim: 'consistency', phases: [1], min: 5,
      title: 'Make it stupidly small',
      detail: 'Take the habit you keep failing and cut it to the version you could do with flu. Two minutes. Do that version today even if you feel great. You are training the showing up, not the doing.' },
    { id: 'p_con2', cat: 'practice', dim: 'consistency', phases: [1,2], min: 5,
      title: 'Attach it to something you already do',
      detail: 'Pick an existing reliable moment — kettle on, car door shut, teeth brushed — and hang the new habit off it. "After X, I do Y." Write the sentence out and put it where you will see it.' },
    { id: 'p_con3', cat: 'practice', dim: 'consistency', phases: [2], min: 10,
      title: 'Remove one obstacle tonight',
      detail: 'Whatever you plan to do tomorrow, remove one step of friction now. Clothes out, app deleted, bag packed, phone charging in the hall. Tomorrow-you is not more disciplined, only better equipped.' },
    { id: 'p_con4', cat: 'practice', dim: 'consistency', phases: [2,3], min: 5,
      title: 'Never miss twice',
      detail: 'The rule that matters is not perfection, it is the bounce. If yesterday was a miss, today is non-negotiable. Write "never miss twice" somewhere you will see it this week.' },
    { id: 'p_con5', cat: 'practice', dim: 'consistency', phases: [3], min: 10,
      title: 'Plan for the derailer',
      detail: 'You already named what knocks you off. Write the if-then now: "If I am exhausted, then I do the two-minute version." Decide once, in calm, so you are not deciding in the moment.' },
    { id: 'p_con6', cat: 'practice', dim: 'consistency', phases: [3,4], min: 10,
      title: 'Audit the week',
      detail: 'Look at the last seven days honestly. What did you actually do versus what you intended? No judgement — you are looking for the pattern in when it slips, not for a verdict.' },

    /* ---------- PRACTICE: vitality ---------- */
    { id: 'p_vit1', cat: 'practice', dim: 'vitality', phases: [1], min: 10,

    { id: 'p_vit3', cat: 'practice', dim: 'vitality', phases: [1,2], min: 10,

    { id: 'p_vit4', cat: 'practice', dim: 'vitality', phases: [2], min: 20,

    { id: 'p_vit6', cat: 'practice', dim: 'vitality', phases: [3], min: 10,

    { id: 'p_vit7', cat: 'practice', dim: 'vitality', phases: [3,4], min: 20,

    { id: 'p_pur3', cat: 'practice', dim: 'purpose', phases: [2], min: 15,

/* ---- src/engine/engine.js ---- */
/* Museschool — scoring, plan generation and daily task selection.
 * Everything here is deterministic: the same answers and the same date
 * always produce the same plan and the same day.
 */
(function (MS) {
  'use strict';

  var PHASE_DAYS = 21;   // three weeks per phase
  var TOTAL_DAYS = 84;   // twelve weeks

  MS.PHASE_DAYS = PHASE_DAYS;
  MS.TOTAL_DAYS = TOTAL_DAYS;

  /* ---------- dates ---------- */

  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function fromKey(k) {
    var p = k.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  // Whole days between two day-keys, immune to daylight saving shifts.
  function daysBetween(fromK, toK) {
    var a = fromKey(fromK), b = fromKey(toK);
    return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
                       Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  }

  function addDays(k, n) {
    var d = fromKey(k);
    d.setDate(d.getDate() + n);
    return dayKey(d);
  }

  MS.dayKey = dayKey;
  MS.fromKey = fromKey;
  MS.daysBetween = daysBetween;
  MS.addDays = addDays;

  /* ---------- deterministic pseudo-randomness ---------- */

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0);
  }
  MS.hash = hash;

  /* ---------- scoring ---------- */

  /* Turns scale answers into a 0-100 score per dimension.
   * Dimensions with no answers come back at 50 so they neither
   * dominate nor disappear from the ranking. */
  MS.score = function (answers) {
    var sums = {}, counts = {};
    MS.DIM_KEYS.forEach(function (k) { sums[k] = 0; counts[k] = 0; });

    MS.QUIZ.forEach(function (section) {
      section.questions.forEach(function (q) {
        if (q.type !== 'scale') return;
        var v = answers[q.id];
        if (typeof v !== 'number') return;
        if (q.reverse) v = 6 - v;
        sums[q.dim] += v;
        counts[q.dim] += 1;
      });
    });

    var out = {};
    MS.DIM_KEYS.forEach(function (k) {
      out[k] = counts[k]
        ? Math.round(((sums[k] - counts[k]) / (4 * counts[k])) * 100)
        : 50;
    });
    return out;
  };

  /* ---------- plan generation ---------- */

  function pickKeystones(scores, answers) {
    var goals = Array.isArray(answers.goals) ? answers.goals : [];
    var primary = answers.primaryGoal;

    var ranked = MS.DIM_KEYS.map(function (k) {
      var urgency = scores[k];                       // lower score = more urgent
      if (goals.indexOf(k) !== -1) urgency -= 22;    // they asked for this
      if (primary === k) urgency -= 15;              // they asked for it most
      // A weak floor outranks everything: you cannot do the rest without it.
      if ((k === 'vitality' || k === 'regulation') && scores[k] < 40) urgency -= 20;
      return { k: k, urgency: urgency, score: scores[k] };
    }).sort(function (a, b) { return a.urgency - b.urgency; });

    return ranked.slice(0, 2).map(function (r) { return r.k; });
  }

  function pickStrength(scores, keystones) {
    return MS.DIM_KEYS
      .filter(function (k) { return keystones.indexOf(k) === -1; })
      .sort(function (a, b) { return scores[b] - scores[a]; })[0];
  }

  /* The focus dimensions for a phase: its own base, with the keystones
   * woven in so they are never out of sight for long. */
  function phaseFocus(phase, keystones) {
    var f = phase.base.slice();
    keystones.forEach(function (k) {
      // Keystone 1 is present in every phase; keystone 2 joins from phase 2.
      var idx = keystones.indexOf(k);
      if (idx === 0 || phase.n >= 2) {
        if (f.indexOf(k) === -1) f.push(k);
      }
    });
    // When the keystones are already part of the phase's own base, the focus
    // would be thin. Top it up so every phase carries at least three strands.
    for (var i = 0; f.length < 3 && i < keystones.length; i++) {
      if (f.indexOf(keystones[i]) === -1) f.push(keystones[i]);
    }
    for (var j = 0; f.length < 3 && j < MS.DIM_KEYS.length; j++) {
      if (f.indexOf(MS.DIM_KEYS[j]) === -1) f.push(MS.DIM_KEYS[j]);
    }
    return f;
  }
  MS.phaseFocus = phaseFocus;

  MS.buildPlan = function (answers, startKey) {
    var scores = MS.score(answers);
    var keystones = pickKeystones(scores, answers);
    var strength = pickStrength(scores, keystones);
    var isRel = answers.primaryGoal === 'relationship' ||
      (Array.isArray(answers.goals) && answers.goals.indexOf('relationship') !== -1);

    var minutes = parseInt(answers.minutes || '20', 10);

    // The anchor is the daily habit for the primary keystone. With a bigger
    // time budget a second anchor comes from keystone two.
    var anchors = [anchorFor(keystones[0])];
    if (minutes >= 40 && keystones[1]) anchors.push(anchorFor(keystones[1]));

    var phases = MS.PHASES.map(function (p) {
      var focus = phaseFocus(p, keystones);
      return {
        n: p.n, name: p.name, line: p.line, body: p.body,
        weeks: p.weeks, focus: focus,
        milestones: focus.slice(0, 4).map(function (dim) {
          return { dim: dim, text: MS.MILESTONES[dim][p.n - 1] };
        })
      };
    });

    return {
      version: 1,
      generatedAt: new Date().toISOString(),
      startKey: startKey || dayKey(),
      seed: hash(JSON.stringify(answers)),
      scores: scores,
      keystones: keystones,
      strength: strength,
      relationship: isRel,
      minutes: minutes,
      days: parseInt(answers.days || '6', 10),
      anchors: anchors.map(function (t) { return t.id; }),
      phases: phases
    };
  };

  function anchorFor(dim) {
    return MS.TASKS.filter(function (t) {
      return t.cat === 'anchor' && t.dim === dim;
    })[0];
  }

  MS.taskById = function (id) {
    for (var i = 0; i < MS.TASKS.length; i++) {
      if (MS.TASKS[i].id === id) return MS.TASKS[i];
    }
    return null;
  };

  /* ---------- where in the plan is a given day ---------- */

  MS.dayInfo = function (plan, key) {
    var idx = daysBetween(plan.startKey, key);
    var clamped = Math.max(0, Math.min(idx, TOTAL_DAYS - 1));
    var phaseN = Math.min(4, Math.floor(clamped / PHASE_DAYS) + 1);
    return {
      index: idx,                                   // may be negative or past the end
      dayNumber: idx + 1,
      phaseN: phaseN,
      phase: plan.phases[phaseN - 1],
      dayInPhase: (clamped % PHASE_DAYS) + 1,
      week: Math.floor(clamped / 7) + 1,
      weekInPhase: Math.floor((clamped % PHASE_DAYS) / 7) + 1,
      beforeStart: idx < 0,
      finished: idx >= TOTAL_DAYS
    };
  };

  /* Rest days come off the back of the week: 5 days/week rests Sat+Sun,
   * 6 rests Sun, 7 never rests. */
  MS.isLightDay = function (plan, key) {

/* Museschool — persistence. Everything lives in this browser and nowhere else.
 * No account, no server, no network call. That is deliberate: the quiz asks
 * for things people would not type into someone else's database. */
(function (MS) {
  'use strict';

  var KEY = 'museschool.v1';

  function blank() {
    return {
      v: 1,
      createdAt: new Date().toISOString(),
      answers: {},
      plan: null,
      quizSection: 0,
      log: {},        // dayKey -> { tasks:{id:true}, done, mood, energy, note }
      journal: [],    // { date, taskId, title, text, ts }
      checkins: [],   // { date, scores }
      settings: { theme: 'auto' }
    };
  }

  var state = blank();

  MS.store = {
    get: function () { return state; },

    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.v === 1) state = Object.assign(blank(), parsed);
        }
      } catch (e) {
        // Private mode, blocked site data, corrupt JSON — start fresh rather
        // than dying on load.
        console.warn('Museschool: could not read saved data', e);
      }
      return state;
    },

    save: function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Museschool: could not save', e);
      }
    },

    reset: function () {
      state = blank();
      try { localStorage.removeItem(KEY); } catch (e) {}
    },

    /* ----- answers ----- */
    setAnswer: function (id, value) {
      state.answers[id] = value;
      this.save();
    },

    /* ----- daily log ----- */
    entry: function (key) {
      if (!state.log[key]) {
        state.log[key] = { tasks: {}, done: 0, mood: null, energy: null, note: '' };
      }
      return state.log[key];
    },

    toggleTask: function (key, taskId) {
      var e = this.entry(key);
      if (e.tasks[taskId]) delete e.tasks[taskId];
      else e.tasks[taskId] = true;
      e.done = Object.keys(e.tasks).length;
      this.save();
      return !!e.tasks[taskId];
    },

    setCheckin: function (key, field, value) {
      var e = this.entry(key);
      e[field] = value;
      this.save();
    },

    /* ----- journal ----- */
    saveJournal: function (date, taskId, title, text) {
      var found = state.journal.filter(function (j) {
        return j.date === date && j.taskId === taskId;
      })[0];
      if (found) {
        found.text = text;
        found.ts = Date.now();
      } else {
        state.journal.push({ date: date, taskId: taskId, title: title, text: text, ts: Date.now() });
      }
      this.save();
    },

    journalFor: function (date, taskId) {
      var f = state.journal.filter(function (j) {
        return j.date === date && j.taskId === taskId;
      })[0];
      return f ? f.text : '';
    },

    /* ----- re-assessment ----- */
    addCheckin: function (scores) {
      state.checkins.push({ date: MS.dayKey(), scores: scores });
      this.save();
    },

    /* ----- portability ----- */
    exportJSON: function () {
      return JSON.stringify(state, null, 2);
    },

    importJSON: function (text) {
      var parsed = JSON.parse(text);
      if (!parsed || parsed.v !== 1) throw new Error('Not a Museschool backup file.');
      state = Object.assign(blank(), parsed);
      this.save();
    }
  };
})(window.MS = window.MS || {});

        '<div class="btn-row" style="margin-top:22px">' +

          '<button class="btn btn-ghost" data-act="restart-plan">Run another twelve weeks</button>' +
        '</div></div>');
    }

    var doneCount = res.tasks.filter(function (t) { return e.tasks[t.id]; }).length;
    var allDone = doneCount === res.tasks.length && res.tasks.length > 0;
    var total = res.tasks.reduce(function (n, t) { return n + t.min; }, 0);

    var head = '' +
      '<div class="spread">' +
        '<div>' +
          '<p class="eyebrow">Day ' + info.dayNumber + ' · Week ' + info.week + ' · Phase ' + info.phaseN + '</p>' +
          '<h2 style="margin-top:6px">' + esc(longDate(key)) + '</h2>' +
        '</div>' +
      '</div>' +
      '<p class="muted small" style="margin:10px 0 0"><em>' + esc(info.phase.line) + '</em> · ' +
        'about ' + total + ' minutes' + (res.light ? ' · rest day' : '') + '</p>';

    var tasks = res.tasks.map(function (t) {
      return taskCard(t, !!e.tasks[t.id], key);
    }).join('');

    var checkin = '' +
      '<hr class="divider">' +
      '<p class="eyebrow">Close the day</p>' +
      '<div class="card" style="margin-top:12px">' +
        meter('mood', 'How was your head today?', e.mood) +
        meter('energy', 'How was your energy?', e.energy) +
        '<label class="small muted" style="display:block;margin:16px 0 6px">One line about today</label>' +
        '<textarea data-input="note" data-day="' + key + '" style="min-height:70px" ' +
          'placeholder="Anything worth remembering.">' + esc(e.note || '') + '</textarea>' +
      '</div>';

    return page('<div class="wrap">' + head +
      (allDone ? '<div class="note" style="margin:18px 0 0"><strong>Day done.</strong> ' +
        'That is the whole job today. The compounding is invisible for a few weeks and then it is not.</div>' : '') +
      '<div style="margin-top:20px">' + tasks + '</div>' +
      (res.light ? '<p class="dim tiny">A lighter day by design — you chose ' + plan.days +
        ' days a week. Rest is part of the plan, not a gap in it.</p>' : '') +
      checkin +
    '</div>');
  };

  function meter(field, label, value) {
    var out = '<label class="small muted" style="display:block;margin-bottom:6px">' + esc(label) + '</label>' +
      '<div class="scale" style="margin-bottom:6px">';
    for (var n = 1; n <= 5; n++) {
      out += '<button type="button" data-act="meter" data-field="' + field + '" data-v="' + n + '"' +
        ' aria-pressed="' + (value === n) + '"><b>' + n + '</b></button>';
    }
    return out + '</div>';
  }

  function taskCard(t, done, key) {
    var isWriting = t.cat === 'reflect';
    var chipClass = t.cat === 'anchor' ? ' chip-anchor' : (isWriting ? ' chip-reflect' : '');
    var text = isWriting ? MS.store.journalFor(key, t.id) : '';
    return '' +
      '<div class="task' + (done ? ' done' : '') + '">' +
        '<button class="tick" data-act="tick" data-task="' + esc(t.id) + '" ' +
          'aria-label="Mark done" aria-pressed="' + done + '">✓</button>' +
        '<div class="task-body">' +
          '<div class="task-meta">' +
            '<span class="chip' + chipClass + '">' + esc(t.cat) + '</span>' +
            '<span class="chip">' + esc(MS.DIMENSIONS[t.dim].short) + '</span>' +
            '<span class="chip">' + t.min + ' min</span>' +
          '</div>' +
          '<div class="task-title">' + esc(t.title) + '</div>' +
          '<div class="task-detail">' + esc(t.detail) + '</div>' +
          (isWriting
            ? '<div class="task-journal">' +
                '<textarea data-input="journal" data-task="' + esc(t.id) + '" ' +
                  'data-title="' + esc(t.title) + '" data-day="' + key + '" ' +
                  'placeholder="Write it here. It saves as you type and stays on this device.">' +
                  esc(text) + '</textarea>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* ---------- plan ---------- */

  U.plan = function (st) {
    var plan = st.plan;
    var info = MS.dayInfo(plan, MS.dayKey());
    var D = MS.DIMENSIONS;
    return page('<div class="wrap">' +
      '<p class="eyebrow">The plan</p>' +
      '<h2 style="margin:8px 0 16px">Twelve weeks, four phases</h2>' +
      '<div class="stats">' +
        stat(info.beforeStart ? '—' : Math.min(info.dayNumber, MS.TOTAL_DAYS), 'of 84 days') +
        stat(info.phaseN, 'phase') +
        stat(plan.minutes + 'm', 'per day') +
      '</div>' +
      '<hr class="divider">' +
      '<p class="eyebrow">Your keystones</p>' +
      '<p class="muted small" style="margin:8px 0 16px">Everything below is weighted toward these two. ' +
      'They were the lowest-scoring things you also said you cared about.</p>' +
      plan.keystones.map(function (k) {
        return '<div class="card card-tight"><h3>' + esc(D[k].label) + '</h3>' +
          '<p class="muted small" style="margin:6px 0 0">' + esc(MS.DIM_READ[k]) + '</p></div>';
      }).join('') +
      (plan.relationship ? U.relationshipNote(st) : '') +
      '<hr class="divider">' +
      '<div style="margin-top:16px">' + U.phaseList(plan, info.phaseN) + '</div>' +
    '</div>');
  };

  function stat(v, label) {
    return '<div class="stat"><b>' + esc(v) + '</b><span>' + esc(label) + '</span></div>';
  }

  /* ---------- progress ---------- */

  U.progress = function (st) {
    var plan = st.plan;
    var stats = MS.completionStats(st.log, plan);
    var streak = MS.streak(st.log, plan);
    var info = MS.dayInfo(plan, MS.dayKey());
    var latest = st.checkins.length ? st.checkins[st.checkins.length - 1].scores : null;

    // A re-score is due at the end of each phase.
    var phasesDone = Math.floor(Math.max(0, info.index) / MS.PHASE_DAYS);
    var due = phasesDone > st.checkins.length;

    var moods = Object.keys(st.log)
      .sort()
      .filter(function (k) { return st.log[k].mood; })
      .slice(-28);

    return page('<div class="wrap">' +
      '<p class="eyebrow">Progress</p>' +
      '<h2 style="margin:8px 0 18px">What you have actually done</h2>' +
      '<div class="stats">' +
        stat(streak, 'day streak') +
        stat(stats.rate + '%', 'tasks done') +
        stat(stats.daysActive, 'active days') +
      '</div>' +

      (due
        ? '<div class="note" style="margin-top:18px"><strong>Phase ' + phasesDone + ' is done — time to re-score.</strong> ' +
          'Nine questions, same as the ones from the quiz. It takes two minutes and it is the only way to see ' +
          'whether any of this is moving.' +
          '<div style="margin-top:12px"><button class="btn" data-act="recheck">Re-score now</button></div></div>'
        : '') +

      '<hr class="divider">' +
      '<p class="eyebrow">Your nine dimensions</p>' +
      '<p class="muted small" style="margin:8px 0 16px">' +
        (latest
          ? 'Bars show your latest re-score. The vertical mark is where you started.'
          : 'Where you started. Re-score at the end of each phase to see this move.') +
      '</p>' +
      '<div class="bars">' + U.bars(latest || plan.scores, plan.keystones, latest ? plan.scores : null) + '</div>' +

      (moods.length > 2 ? moodChart(st, moods) : '') +

      '<hr class="divider">' +
      '<p class="eyebrow">The arc</p>' +
      '<div style="margin-top:16px">' + U.phaseList(plan, info.phaseN) + '</div>' +
    '</div>');
  };

  /* A small inline SVG — mood and energy over the last few weeks. */
  function moodChart(st, keys) {
    var w = 320, h = 90, pad = 6;
    function line(field, color) {
      var pts = keys.map(function (k, i) {
        var v = st.log[k][field] || 3;
        var x = pad + (i / Math.max(1, keys.length - 1)) * (w - pad * 2);
        var y = h - pad - ((v - 1) / 4) * (h - pad * 2);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      return '<polyline points="' + pts + '" fill="none" stroke="' + color +
        '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    return '' +
      '<hr class="divider">' +
      '<p class="eyebrow">Head and energy · last ' + keys.length + ' logged days</p>' +
      '<div class="scroll-x" style="margin-top:14px">' +
        '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" ' +
          'preserveAspectRatio="none" role="img" aria-label="Mood and energy over time">' +
          line('mood', 'var(--accent)') + line('energy', 'var(--teal)') +
        '</svg>' +
      '</div>' +
      '<div class="row small dim" style="margin-top:8px;gap:18px">' +
        '<span><b style="color:var(--accent)">—</b> head</span>' +
        '<span><b style="color:var(--teal)">—</b> energy</span>' +
      '</div>';
  }

  /* ---------- re-score ---------- */

  /* Two questions per dimension. One would snap every score to a quintile,
   * which reads as precision the answer does not have next to the four-to-six
   * question average from the original quiz. */
  function recheckQuestions() {
    var byDim = {};
    MS.DIM_KEYS.forEach(function (d) { byDim[d] = []; });
    MS.QUIZ.forEach(function (s) {
      s.questions.forEach(function (q) {
        if (q.type === 'scale' && byDim[q.dim]) byDim[q.dim].push(q);
      });
    });
    var out = [];
    MS.DIM_KEYS.forEach(function (d) {
      // Prefer plainly-worded questions over the reverse-scored ones.
      var pool = byDim[d].filter(function (q) { return !q.reverse; });
      if (pool.length < 2) pool = pool.concat(byDim[d].filter(function (q) { return q.reverse; }));
      out = out.concat(pool.slice(0, 2));
    });
    return out;
  }

  U.recheck = function (st) {
    var qs = recheckQuestions();
    var pending = MS.recheckAnswers || (MS.recheckAnswers = {});
    var answeredCount = qs.filter(function (q) { return pending[q.id]; }).length;
    var ready = answeredCount === qs.length;

    return page('<div class="wrap">' +
      '<p class="eyebrow">Re-score</p>' +
      '<h2 style="margin:8px 0 6px">Same questions, today\'s answers</h2>' +
      '<p class="muted">Answer as of the last two weeks, not as of your best day. ' +
      qs.length + ' questions, about two minutes.</p>' +
      '<div class="progressbar" style="margin-top:16px"><i style="width:' +
        Math.round((answeredCount / qs.length) * 100) + '%"></i></div>' +
      qs.map(function (q) {
        var v = pending[q.id];
        var out = '<div class="q"><div class="q-text">' + esc(q.text) + '</div><div class="scale">';
        for (var n = 1; n <= 5; n++) {
          out += '<button type="button" data-act="recheck-set" data-q="' + q.id + '" data-v="' + n + '"' +
            ' aria-pressed="' + (v === n) + '"><b>' + n + '</b><span>' + esc(q.labels[n - 1]) + '</span></button>';
        }
        return out + '</div></div>';
      }).join('') +
      '<div class="btn-row" style="margin-top:26px">' +
        '<button class="btn btn-ghost" data-act="go" data-view="progress">Cancel</button>' +
        '<button class="btn" data-act="recheck-save"' + (ready ? '' : ' disabled') + '>Save re-score</button>' +
      '</div>' +
      (ready ? '' : '<p class="dim tiny" style="margin-top:10px">' +
        (qs.length - answeredCount) + ' left.</p>') +
    '</div>');
  };

  /* ---------- journal ---------- */

  U.journal = function (st) {
    var entries = st.journal
      .filter(function (j) { return j.text && j.text.trim(); })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var notes = Object.keys(st.log)
      .filter(function (k) { return st.log[k].note && st.log[k].note.trim(); })
      .sort().reverse();

    var body = '';
    if (!entries.length && !notes.length) {
      body = '<p class="muted">Nothing yet. The written tasks on your Today screen land here, ' +
        'along with your end-of-day lines. In eight weeks this is the part you will actually want to read back.</p>';
    } else {
      body = entries.map(function (j) {
        return '<div class="jentry">' +
          '<div class="spread"><strong class="small">' + esc(j.title) + '</strong>' +
          '<span class="dim tiny">' + esc(longDate(j.date)) + '</span></div>' +
          '<pre>' + esc(j.text) + '</pre></div>';
      }).join('');
      if (notes.length) {
        body += '<hr class="divider"><p class="eyebrow">End-of-day lines</p>' +
          notes.map(function (k) {
            return '<div class="jentry"><div class="spread">' +
              '<span class="dim tiny">' + esc(longDate(k)) + '</span></div>' +
              '<pre>' + esc(st.log[k].note) + '</pre></div>';
          }).join('');
      }
    }

    return page('<div class="wrap">' +
      '<p class="eyebrow">Journal</p>' +
      '<h2 style="margin:8px 0 18px">' + entries.length + ' written ' +
        (entries.length === 1 ? 'entry' : 'entries') + '</h2>' +
      body +
    '</div>');
  };

  /* ---------- settings ---------- */

  U.settings = function (st) {
    var theme = st.settings.theme || 'auto';
    var rel = st.answers.relLegacy;
    return page('<div class="wrap">' +
      '<p class="eyebrow">You</p>' +
      '<h2 style="margin:8px 0 18px">' + esc(st.answers.name || 'Settings') + '</h2>' +

      (rel && rel.trim()
        ? '<div class="card"><p class="eyebrow">What you said you wanted to be true in a year</p>' +
          '<p style="margin:10px 0 0;font-family:var(--font-display);font-size:1.1rem;line-height:1.45">' +
          esc(rel) + '</p></div>'
        : '') +

      '<div class="card" style="margin-top:14px">' +
        '<p class="eyebrow">Appearance</p>' +
        '<div class="btn-row" style="margin-top:12px">' +
          ['auto', 'light', 'dark'].map(function (t) {
            return '<button class="btn ' + (theme === t ? '' : 'btn-ghost') +
              '" data-act="theme" data-v="' + t + '">' + t + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow">Your data</p>' +
        '<p class="muted small" style="margin:10px 0 14px">Everything is stored in this browser only. ' +
        'Clearing site data or switching device loses it, so export a backup if it matters to you.</p>' +
        '<div class="btn-row" style="flex-wrap:wrap">' +
          '<button class="btn btn-ghost" data-act="export">Copy backup</button>' +
          '<button class="btn btn-ghost" data-act="import">Restore backup</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow">Start again</p>' +
        '<p class="muted small" style="margin:10px 0 14px">Retake the quiz and build a fresh plan. ' +
        'Your journal and daily log are kept.</p>' +
        '<div class="btn-row" style="flex-wrap:wrap">' +
          '<button class="btn btn-ghost" data-act="retake">Retake the quiz</button>' +
          '<button class="btn btn-quiet" data-act="wipe">Erase everything</button>' +
        '</div>' +
      '</div>' +

      '<p class="dim tiny" style="margin-top:22px">Museschool is a structured self-directed programme, ' +
      'not therapy and not a substitute for it. If you are in crisis, or if what you are working through is ' +
      'heavier than a daily task list, please talk to a professional or someone you trust.</p>' +
    '</div>');
  };

  /* ---------- chrome ---------- */

  function page(inner) {
    return nav() + inner;
  }

  function nav() {
    return '<nav class="nav">' + NAV.map(function (n) {
      return '<button data-act="go" data-view="' + n.id + '"' +
        (MS.view === n.id ? ' aria-current="page"' : '') + '>' +
        '<i>' + n.icon + '</i>' + n.label + '</button>';
    }).join('') + '</nav>';
  }

  U.toast = function (msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  };

  /* ---------- render ---------- */

  MS.render = function () {
    var st = MS.store.get();
    document.documentElement.setAttribute('data-theme', st.settings.theme || 'auto');

    var html;
    if (!st.plan) {
      html = MS.view === 'quiz' ? U.quiz(st)
           : MS.view === 'reveal' ? U.reveal(st)
           : U.welcome(st);
    } else if (MS.view === 'quiz') {
      html = U.quiz(st);
    } else if (MS.view === 'reveal') {
      html = U.reveal(st);
    } else if (MS.view === 'recheck') {
      html = U.recheck(st);
    } else {
      html = (U[MS.view] || U.today)(st);
    }

    // Preserve focus and caret across re-render for the field being typed in.
    var active = document.activeElement;
    var restore = active && active.tagName === 'TEXTAREA'
      ? { key: active.dataset.input + '|' + (active.dataset.task || '') , pos: active.selectionStart }
      : null;

    root.innerHTML = html;

    if (restore) {
      var next = Array.prototype.find.call(root.querySelectorAll('textarea'), function (t) {
        return t.dataset.input + '|' + (t.dataset.task || '') === restore.key;
      });
      if (next) { next.focus(); try { next.setSelectionRange(restore.pos, restore.pos); } catch (e) {} }
    }
  };

  /* ---------- events ---------- */

  function onClick(ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    flushInput();
    var st = MS.store.get();
    var act = btn.dataset.act;
    var scroll = true;

    switch (act) {
      case 'quiz-start':
        MS.view = 'quiz'; break;

      case 'quiz-restart':
        st.answers = {}; st.quizSection = 0; MS.store.save();
        MS.view = 'quiz'; break;

      case 'quiz-next':
        st.quizSection++; MS.store.save(); break;

      case 'quiz-back':
        st.quizSection = Math.max(0, st.quizSection - 1); MS.store.save(); break;

      case 'quiz-finish':
        st.plan = MS.buildPlan(st.answers, MS.dayKey());
        MS.store.save();
        MS.view = 'reveal'; break;

      case 'begin':
        MS.view = 'today'; break;

      case 'set':
        MS.store.setAnswer(btn.dataset.q, coerce(btn.dataset.v));
        scroll = false; break;

      case 'toggle': {
        var q = btn.dataset.q;
        var max = parseInt(btn.dataset.max, 10) || 99;
        var cur = Array.isArray(st.answers[q]) ? st.answers[q].slice() : [];
        var i = cur.indexOf(btn.dataset.v);
        if (i !== -1) cur.splice(i, 1);
        else if (cur.length < max) cur.push(btn.dataset.v);
        else { U.toast('Pick at most ' + max + '.'); return; }
        MS.store.setAnswer(q, cur);
        scroll = false; break;
      }

      case 'go':
        MS.view = btn.dataset.view; break;

      case 'tick': {
        var on = MS.store.toggleTask(MS.dayKey(), btn.dataset.task);
        if (on) U.toast('Done.');
        scroll = false; break;
      }

      case 'meter':
        MS.store.setCheckin(MS.dayKey(), btn.dataset.field, parseInt(btn.dataset.v, 10));
        scroll = false; break;

      case 'recheck':
        MS.recheckAnswers = {}; MS.view = 'recheck'; break;

      case 'recheck-set':
        MS.recheckAnswers[btn.dataset.q] = parseInt(btn.dataset.v, 10);
        scroll = false; break;

      case 'recheck-save': {
        // Same normalisation as the original quiz, so the numbers are comparable.
        var sums = {}, counts = {}, scores = {};
        recheckQuestions().forEach(function (qq) {
          var v = MS.recheckAnswers[qq.id];
          if (typeof v !== 'number') return;
          if (qq.reverse) v = 6 - v;
          sums[qq.dim] = (sums[qq.dim] || 0) + v;
          counts[qq.dim] = (counts[qq.dim] || 0) + 1;
        });
        MS.DIM_KEYS.forEach(function (dim) {
          scores[dim] = counts[dim]
            ? Math.round(((sums[dim] - counts[dim]) / (4 * counts[dim])) * 100)
            : st.plan.scores[dim];
        });
        MS.store.addCheckin(scores);
        MS.recheckAnswers = {};
        MS.view = 'progress';
        U.toast('Re-scored.');
        break;
      }

      case 'theme':
        st.settings.theme = btn.dataset.v; MS.store.save(); scroll = false; break;

      case 'export': {
        var text = MS.store.exportJSON();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text)
            .then(function () { U.toast('Backup copied to clipboard.'); })
            .catch(function () { window.prompt('Copy your backup:', text); });
        } else {
          window.prompt('Copy your backup:', text);
        }
        return;
      }

      case 'import': {
        var input = window.prompt('Paste a Museschool backup:');
        if (!input) return;
        try { MS.store.importJSON(input); U.toast('Backup restored.'); MS.view = 'today'; }
        catch (err) { U.toast('That did not look like a backup.'); return; }
        break;
      }

      case 'retake':
        if (!confirm('Retake the quiz and build a new plan? Your journal and daily log are kept.')) return;
        st.answers = {}; st.plan = null; st.quizSection = 0; MS.store.save();
        MS.view = 'quiz'; break;

      case 'restart-plan':
        st.plan = MS.buildPlan(st.answers, MS.dayKey());
        st.checkins = [];
        MS.store.save();
        MS.view = 'reveal'; break;

      case 'wipe':
        if (!confirm('Erase everything — answers, plan, journal and log? This cannot be undone.')) return;
        MS.store.reset(); MS.view = 'today'; break;

      default: return;
    }

    MS.render();
    if (scroll) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function coerce(v) {
    return /^\d+$/.test(v) ? parseInt(v, 10) : v;
  }

  /* Typing saves on a short debounce rather than on every keystroke. Any
   * click flushes the pending save first — otherwise a re-render triggered
   * between the keystroke and the timer would blank the field on screen and
   * the next edit would save over what was typed. */
  var typeTimer, pendingInput;

  function flushInput() {
    clearTimeout(typeTimer);
    var p = pendingInput;
    if (!p) return false;
    pendingInput = null;
    if (p.kind === 'journal') {
      MS.store.saveJournal(p.day, p.task, p.title, p.value);
    } else if (p.kind === 'note') {
      MS.store.setCheckin(p.day, 'note', p.value);
    } else {
      MS.store.setAnswer(p.kind, p.value);
    }
    return true;
  }

  function onInput(ev) {
    var el = ev.target;
    var kind = el.dataset.input;
    if (!kind) return;
    clearTimeout(typeTimer);
    pendingInput = {
      kind: kind, value: el.value,
      day: el.dataset.day, task: el.dataset.task, title: el.dataset.title
    };
    typeTimer = setTimeout(function () {
      var wasQuiz = MS.view === 'quiz';
      flushInput();
      // In the quiz, Next unlocks once a required field has content.
      if (wasQuiz) MS.render();
    }, 350);
  }

  /* ---------- boot ---------- */

  MS.boot = function () {
    root = document.getElementById('app');
