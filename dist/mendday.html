<title>Mendday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mendday — one stylesheet.
   The page is a logbook: ruled rather than carded, with the data set in a
   monospace so day counts, scores and deltas line up in columns.

   Light is defined on bare :root; dark redefines only the tokens, guarded so
   an explicit light choice always beats a dark system preference. */

:root {
  --ground: #E8EAE6;
  --surface: #F6F7F4;
  --surface-2: #DFE3DD;
  --ink: #13181A;
  --ink-2: #4C5457;
  --ink-3: #828A8B;
  --rule: #CFD5CF;
  --rule-2: #B4BCB4;
  --accent: #12544A;
  --accent-ink: #F6F7F4;
  --accent-soft: #D8E3DF;
  --signal: #96650F;
  --signal-soft: #EDE2CB;
  --good: #2F6B4A;
  --radius: 3px;
  --display: "Spectral", ui-serif, Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101413;
    --surface: #171C1B;
    --surface-2: #212827;
    --ink: #E6EAE6;
    --ink-2: #A6AFAD;
    --ink-3: #77817F;
    --rule: #262E2C;
    --rule-2: #364240;
    --accent: #5FA99B;
    --accent-ink: #0C110F;
    --accent-soft: #172825;
    --signal: #C79A3E;
    --signal-soft: #271F10;
    --good: #6FB088;
  }
}

:root[data-theme="dark"] {
  --ground: #101413;
  --surface: #171C1B;
  --surface-2: #212827;
  --ink: #E6EAE6;
  --ink-2: #A6AFAD;
  --ink-3: #77817F;
  --rule: #262E2C;
  --rule-2: #364240;
  --accent: #5FA99B;
  --accent-ink: #0C110F;
  --accent-soft: #172825;
  --signal: #C79A3E;
  --signal-soft: #271F10;
  --good: #6FB088;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 92px;
}

h1, h2, h3 {
  font-family: var(--display);
  font-weight: 600;
  line-height: 1.15;
  margin: 0;
  letter-spacing: -0.012em;
  text-wrap: balance;
}
h1 { font-size: clamp(1.95rem, 5.2vw, 2.7rem); }
h2 { font-size: clamp(1.35rem, 3.6vw, 1.75rem); }
h3 { font-size: 1.05rem; }
p { margin: 0 0 1em; }
a { color: var(--accent); }

.wrap { max-width: 660px; margin: 0 auto; padding: 26px 20px 48px; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.small { font-size: .875rem; }
.tiny { font-size: .76rem; }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 0; }
.row { display: flex; gap: 10px; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.hide { display: none !important; }
.scroll-x { overflow-x: auto; }

/* Uppercase mono micro-label — the logbook's field headings. */
.eyebrow {
  font-family: var(--mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  font-weight: 500;
  color: var(--ink-3);
}

/* ---------- ruled blocks, not floating cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.card + .card { margin-top: -1px; }   /* rules meet rather than double up */
.card-tight { padding: 15px 18px; }

/* ---------- buttons ---------- */
button { font: inherit; cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--mono);
  font-size: .8rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: .09em;
  transition: opacity .12s ease;
}
.btn:hover { opacity: .88; }
.btn[disabled] { opacity: .34; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-2); }
.btn-quiet { background: transparent; color: var(--ink-3); border-color: transparent; padding: 12px 10px; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 10px; align-items: center; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* ---------- quiz ---------- */
.progressbar { height: 2px; background: var(--rule); overflow: hidden; }
.progressbar > i { display: block; height: 100%; background: var(--accent); transition: width .35s ease; }

.q { margin: 30px 0; }
.q-text { font-family: var(--display); font-size: 1.22rem; line-height: 1.32; margin-bottom: 14px; }
.q-note {
  font-family: var(--mono); font-size: .72rem; letter-spacing: .06em;
  color: var(--ink-3); margin: -8px 0 12px;
}

.opt {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 13px 15px; margin-bottom: -1px;
  color: var(--ink); position: relative;
  transition: background .12s ease, border-color .12s ease;
}
.opt:hover { border-color: var(--rule-2); z-index: 1; }
.opt[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft); z-index: 2;
}
.opt-label { font-weight: 500; }
.opt-note { display: block; color: var(--ink-3); font-size: .83rem; margin-top: 1px; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
.scale button {
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2);
  border-radius: 0; padding: 12px 3px 9px; text-align: center;
  margin-right: -1px; position: relative;
  transition: background .12s ease, border-color .12s ease;
}
.scale button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.scale button:last-child { border-radius: 0 var(--radius) var(--radius) 0; margin-right: 0; }
.scale button:hover { border-color: var(--rule-2); z-index: 1; }
.scale button[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft); color: var(--ink); z-index: 2;
}
.scale b {
  display: block; font-family: var(--mono); font-weight: 500;
  font-size: 1rem; font-variant-numeric: tabular-nums;
}
.scale span { display: block; font-size: .62rem; line-height: 1.25; margin-top: 3px; color: var(--ink-3); }

input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 12px 14px; resize: vertical;
}
input[type="text"]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { min-height: 118px; line-height: 1.55; }

/* ---------- the day's entries ---------- */
.task {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 15px 17px; margin-bottom: -1px;
  position: relative;
  transition: opacity .18s ease;
}
.task:hover { z-index: 1; }
.task.done { opacity: .5; }
.task.done .task-title { text-decoration: line-through; text-decoration-thickness: 1px; }
.tick {
  flex: 0 0 22px; width: 22px; height: 22px; margin-top: 3px;
  border-radius: var(--radius); border: 1px solid var(--rule-2);
  background: transparent; color: transparent;
  display: grid; place-items: center; font-size: .72rem; line-height: 1;
  transition: all .15s ease;
}
.tick:hover { border-color: var(--accent); }
.task.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task-body { flex: 1; min-width: 0; }
.task-title { font-weight: 600; font-size: 1rem; }
.task-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 5px; }
.chip {
  font-family: var(--mono); font-size: .64rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: .11em;
  color: var(--ink-3);
}
.chip-anchor { color: var(--signal); }
.chip-reflect { color: var(--accent); }
.task-detail { color: var(--ink-2); font-size: .9rem; margin-top: 5px; }
.task-journal { margin-top: 12px; }
.saved { color: var(--good); font-size: .76rem; }

/* ---------- measurements ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.stat {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 14px 10px; text-align: center;
  margin-right: -1px;
}
.stat:last-child { margin-right: 0; }
.stat b {
  display: block; font-family: var(--mono); font-weight: 500;
  font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.stat span {
  font-family: var(--mono); font-size: .62rem; text-transform: uppercase;
  letter-spacing: .1em; color: var(--ink-3);
}

.bars { display: grid; gap: 0; }
.bar-row {
  display: grid; grid-template-columns: 112px 1fr 46px; gap: 12px;
  align-items: center; font-size: .84rem;
  padding: 7px 0; border-bottom: 1px solid var(--rule);
}
.bar-row:last-child { border-bottom: 0; }
.bar { height: 6px; background: var(--surface-2); position: relative; border-radius: 1px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 1px; transition: width .5s ease; }
.bar > u {
  position: absolute; top: -3px; width: 1px; height: 12px;
  background: var(--ink-3);
}
.bar-val {
  text-align: right; color: var(--ink-2);
  font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums;
}
.bar-key { color: var(--ink-2); }
.bar-row.key .bar-key { color: var(--ink); font-weight: 600; }
.bar-row.key .bar > i { background: var(--signal); }

/* ---------- the arc ---------- */
.phase { border-left: 1px solid var(--rule-2); padding: 0 0 24px 20px; position: relative; }
.phase:last-child { padding-bottom: 0; }
.phase::before {
  content: ""; position: absolute; left: -4px; top: 6px;
  width: 7px; height: 7px;
  background: var(--ground); border: 1px solid var(--rule-2);
}
.phase.now { border-left-color: var(--signal); }
.phase.now::before { background: var(--signal); border-color: var(--signal); }
.phase.past::before { background: var(--rule-2); }
.phase h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.phase h3 .dim {
  font-family: var(--mono); font-size: .68rem !important;
  text-transform: uppercase; letter-spacing: .1em;
}
.ms { list-style: none; padding: 0; margin: 12px 0 0; }
.ms li {
  position: relative; padding-left: 18px; margin-bottom: 6px;
  font-size: .88rem; color: var(--ink-2);
}
.ms li::before { content: "·"; position: absolute; left: 4px; color: var(--rule-2); font-weight: 700; }

/* ---------- navigation ---------- */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: center; gap: 0;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
}
.nav button {
  flex: 1; max-width: 116px; background: none; border: 0;
  color: var(--ink-3); padding: 6px 4px; border-radius: var(--radius);
  font-family: var(--mono); font-size: .63rem;
  text-transform: uppercase; letter-spacing: .1em; font-weight: 500;
}
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav i { display: block; font-size: 1rem; font-style: normal; margin-bottom: 2px; }

/* ---------- misc ---------- */
.note {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 2px solid var(--signal);
  border-radius: var(--radius);
  padding: 15px 17px; font-size: .88rem; color: var(--ink-2);
}
.note strong { color: var(--ink); }
.divider { height: 1px; background: var(--rule); margin: 30px 0; border: 0; }
.jentry { border-bottom: 1px solid var(--rule); padding: 15px 0; }
.jentry:last-child { border-bottom: 0; }
.jentry pre { white-space: pre-wrap; font: inherit; margin: 5px 0 0; color: var(--ink-2); }
.jentry .tiny {
  font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em;
}

.toast {
  position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(6px);
  background: var(--ink); color: var(--ground);
  padding: 9px 16px; border-radius: var(--radius);
  font-family: var(--mono); font-size: .72rem;
  text-transform: uppercase; letter-spacing: .1em;
  opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 40;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 720px) {
  body { padding-bottom: 40px; }
  .nav {
    position: sticky; top: 0; bottom: auto;
    border-top: 0; border-bottom: 1px solid var(--rule);
    padding: 9px 8px; gap: 2px;
  }
  .nav i { display: none; }
  .nav button { padding: 8px 15px; max-width: none; flex: 0 0 auto; }
  .toast { bottom: 32px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- reading ---------- */
.chip-learn { color: var(--signal); }
.task-learn { border-left: 2px solid var(--signal); }

.lesson-body {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-size: .93rem; color: var(--ink-2);
}
.lesson-body p { margin: 0 0 .9em; }
.lesson-body p:last-child { margin-bottom: 0; }
.lesson-body strong { color: var(--ink); font-weight: 600; }
.lesson-practice {
  background: var(--surface-2); border-radius: var(--radius);
  padding: 11px 13px; font-size: .88rem;
}

.lessons { display: flex; flex-direction: column; }
.lesson-row {
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--surface); margin-bottom: -1px; position: relative;
}
.lesson-row.open { z-index: 2; border-color: var(--rule-2); }
.lesson-row .lesson-body { margin: 0 17px 16px; }
.lesson-head {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 12px;
  align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; color: var(--ink);
  padding: 14px 17px;
}
.lesson-head:hover .lesson-title { color: var(--accent); }
.lesson-day {
  font-family: var(--mono); font-size: .8rem; color: var(--signal);
}
.lesson-main { display: block; min-width: 0; }
.lesson-title { display: block; font-weight: 600; font-size: .97rem; }
.lesson-dek { display: block; color: var(--ink-3); font-size: .85rem; margin-top: 2px; }
.lesson-meta {
  font-family: var(--mono); font-size: .66rem; text-transform: uppercase;
  letter-spacing: .09em; color: var(--ink-3); white-space: nowrap;
}

.autosave { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }

</style>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ---- src/data/quiz.js ---- */
/* Mendday — onboarding quiz definition.
 *
 * Question types:
 *   text    free text (opt.placeholder, opt.optional)
 *   single  one choice from opt.options [{v,label,note?}]
 *   multi   many choices, opt.max caps the selection
 *   scale   1..5 agreement. opt.dim maps it to a profile dimension.
 *           opt.reverse means agreeing scores LOW on that dimension.
 *
 * `when` gates a section on earlier answers.
 */
(function (MS) {
  'use strict';

  // Agreement labels shared by every scale question.
  var AGREE = ['Not at all', 'Rarely', 'Sometimes', 'Often', 'Always'];

  function scale(id, dim, text, reverse) {
    return { id: id, type: 'scale', text: text, dim: dim, reverse: !!reverse, labels: AGREE };
  }

  var GOALS = [
    { v: 'relationship', label: 'Repair or rebuild a relationship', note: 'Partner, ex-partner, or someone close' },
    { v: 'partnership', label: 'Being a better partner day to day', note: 'The ordinary skills, not the crisis ones' },
    { v: 'worth', label: 'Confidence and self-worth', note: 'Liking who you are without needing proof' },
    { v: 'regulation', label: 'Emotional steadiness', note: 'Feeling things without being run by them' },
    { v: 'consistency', label: 'Discipline and follow-through', note: 'Doing what you said you would' },
    { v: 'vitality', label: 'Body, sleep and energy', note: 'The physical base underneath everything' },
    { v: 'purpose', label: 'Direction and purpose', note: 'Knowing what you are building' },
    { v: 'connection', label: 'Friendship and community', note: 'A life that is not one person wide' },
    { v: 'presence', label: 'Presence and attention', note: 'Actually being where you are' }
  ];

  MS.GOALS = GOALS;

  MS.QUIZ = [
    {
      id: 'start',
      title: 'Where you are',
      blurb: 'No right answers here. The plan is only as good as how honest this is — and nothing you type leaves this device.',
      questions: [
        { id: 'name', type: 'text', short: true, text: 'What should this call you?', placeholder: 'First name' },
        { id: 'ageRange', type: 'single', text: 'How old are you?', options: [
          { v: 'u25', label: 'Under 25' }, { v: '25_34', label: '25–34' },
          { v: '35_44', label: '35–44' }, { v: '45_54', label: '45–54' },
          { v: '55p', label: '55 or older' }
        ]},
        { id: 'season', type: 'single', text: 'Which best describes the season you are in?', options: [
          { v: 'crisis', label: 'Something just broke', note: 'Recent, raw, still loud' },
          { v: 'drift', label: 'Slow drift', note: 'Nothing exploded, but I have lost the thread' },
          { v: 'stuck', label: 'Stuck in a loop', note: 'Same patterns, same outcomes' },
          { v: 'rebuild', label: 'Rebuilding', note: 'Past the worst, putting it back together' },
          { v: 'sharpen', label: 'Basically okay, want more', note: 'Stable, aiming higher' }
        ]},
        { id: 'prompt', type: 'single', text: 'What brought you here right now?', options: [
          { v: 'loss', label: 'I lost someone or something that mattered' },
          { v: 'pattern', label: 'I keep repeating something I hate' },
          { v: 'told', label: 'Someone told me the truth about myself' },
          { v: 'flat', label: 'I feel flat and I want to feel something' },
          { v: 'ready', label: 'Nothing is wrong. I just want to be better' }
        ]},
        { id: 'duration', type: 'single', text: 'How long has this been going on?', options: [
          { v: 'weeks', label: 'A few weeks' }, { v: 'months', label: 'A few months' },
          { v: 'year', label: 'About a year' }, { v: 'years', label: 'Years' },
          { v: 'always', label: 'As long as I can remember' }
        ]},
        { id: 'kids', type: 'single', text: 'Do you have children?', options: [
          { v: 'none', label: 'No' },
          { v: '1', label: 'One' },
          { v: '2', label: 'Two' },
          { v: '3', label: 'Three or more' }
        ]},
        { id: 'tried', type: 'single', text: 'Have you tried to work on this before?', options: [
          { v: 'never', label: 'Not really' },
          { v: 'started', label: 'I start and stop' },
          { v: 'therapy', label: 'Yes — therapy or coaching' },
          { v: 'alone', label: 'Yes — on my own, books and videos' },
          { v: 'lots', label: 'Many times. That is part of the problem' }
        ]}
      ]
    },

    {
      id: 'want',
      title: 'What you want',
      blurb: 'Aim at something specific. Vague goals produce vague plans.',
      questions: [
        { id: 'goals', type: 'multi', max: 3, text: 'What do you want to work on? Pick up to three.', options: GOALS },
        { id: 'primaryGoal', type: 'single', text: 'If only one of those could change this year, which one?', options: GOALS },
        { id: 'evidence', type: 'multi', max: 3, text: 'Six months from now, what would tell you this actually worked?', options: [
          { v: 'calm', label: 'I stayed calm in a moment that used to wreck me' },
          { v: 'kept', label: 'I kept a promise to myself for months straight' },
          { v: 'heard', label: 'Someone told me I had changed' },
          { v: 'alone_ok', label: 'I was alone and genuinely fine' },
          { v: 'repaired', label: 'A relationship got real again' },
          { v: 'proud', label: 'I looked at my week and felt proud of it' },
          { v: 'body', label: 'I felt strong and rested in my body' }
        ]},
        { id: 'feelMore', type: 'multi', max: 3, text: 'What do you want more of?', options: [
          { v: 'steady', label: 'Steadiness' }, { v: 'warmth', label: 'Warmth' },
          { v: 'respect', label: 'Self-respect' }, { v: 'energy', label: 'Energy' },
          { v: 'clarity', label: 'Clarity' }, { v: 'courage', label: 'Courage' },
          { v: 'peace', label: 'Peace' }, { v: 'joy', label: 'Joy' }
        ]},
        { id: 'giveUp', type: 'multi', max: 3, text: 'What are you actually willing to give up to get there?', options: [
          { v: 'scroll', label: 'Hours of scrolling' },
          { v: 'drink', label: 'Drinking to take the edge off' },
          { v: 'right', label: 'Being right in arguments' },
          { v: 'sleepin', label: 'Sleeping in' },
          { v: 'venting', label: 'Venting to anyone who will listen' },
          { v: 'checking', label: 'Checking what they are doing' },
          { v: 'story', label: 'The story where I am the one who got wronged' }
        ]}
      ]
    },

    {
      id: 'regulation',
      title: 'Emotional steadiness',
      blurb: 'How you handle the moment after something lands badly.',
      questions: [
        scale('reg1', 'regulation', 'When something upsets me, I can feel it without acting on it straight away.'),

    { id: 'p_com5', cat: 'practice', dim: 'communication', phases: [2,3], min: 10,
      title: 'Apologise properly, once',
      detail: 'The format: name the specific thing, name its effect on them, no "but", no explanation of your intent, no request for forgiveness. "I did X. It made you feel Y. I am sorry." Then stop.' },
    { id: 'p_com6', cat: 'practice', dim: 'communication', phases: [3], min: 10,
      title: 'Take a criticism without defending',
      detail: 'If someone gives you feedback today, respond with one of: "tell me more", "you are right", or "let me think about that". Nothing else. The defence you skip is the trust you build.' },
    { id: 'p_com7', cat: 'practice', dim: 'communication', phases: [3,4], min: 10,
      title: 'Say the thing you have been avoiding',
      detail: 'There is one sentence you have not said to someone. Say it, calmly, without a build-up. Most avoided conversations are smaller out loud than they are in your head.' },
    { id: 'p_com8', cat: 'practice', dim: 'communication', phases: [4], min: 10,
      title: 'Hold a boundary kindly',
      detail: 'Say no to one thing without over-explaining. "I cannot do that" is a complete sentence. Warm tone, no negotiation, no five reasons.' },

    /* ---------- PRACTICE: ownership ---------- */
    { id: 'p_own1', cat: 'practice', dim: 'ownership', phases: [1], min: 10,
      title: 'Separate the fact from the story',
      detail: 'Take one grievance. Write two columns: what verifiably happened, and what you decided it meant. Most of the weight sits in the second column, and the second column is yours.' },
    { id: 'p_own2', cat: 'practice', dim: 'ownership', phases: [1,2], min: 10,
      title: 'Your ten per cent',
      detail: 'Take a conflict where you were mostly in the right. Find your ten per cent. Write it down without qualifying it. Owning ten per cent fully beats owning a hundred per cent theoretically.' },
    { id: 'p_own3', cat: 'practice', dim: 'ownership', phases: [2], min: 15,
      title: 'Write their side',
      detail: 'Write a page from the other person\'s point of view, in their voice, as sympathetically as you can manage. Not to agree with it. To be able to hold it.' },
    { id: 'p_own4', cat: 'practice', dim: 'ownership', phases: [2,3], min: 10,
      title: 'Catch one excuse in flight',
      detail: 'Today you will explain away one thing you did. Catch it as it happens and write down the excuse verbatim. Then write the version without it.' },
    { id: 'p_own5', cat: 'practice', dim: 'ownership', phases: [3], min: 10,
      title: 'The repeated note',
      detail: 'What have several different people, in different parts of your life, said about you? If more than one person has named the same thing, it is data, not opinion. Write it down plainly.' },
    { id: 'p_own6', cat: 'practice', dim: 'ownership', phases: [3,4], min: 10,
      title: 'Change one thing you were told about',
      detail: 'Pick one specific behaviour someone asked you to change. Change it today, visibly, without announcing it. Announced change is a request for credit. Quiet change is the real thing.' },

    /* ---------- PRACTICE: consistency ---------- */
    { id: 'p_con1', cat: 'practice', dim: 'consistency', phases: [1], min: 5,
      title: 'Make it stupidly small',
      detail: 'Take the habit you keep failing and cut it to the version you could do with flu. Two minutes. Do that version today even if you feel great. You are training the showing up, not the doing.' },
    { id: 'p_con2', cat: 'practice', dim: 'consistency', phases: [1,2], min: 5,
      title: 'Attach it to something you already do',
      detail: 'Pick an existing reliable moment — kettle on, car door shut, teeth brushed — and hang the new habit off it. "After X, I do Y." Write the sentence out and put it where you will see it.' },
    { id: 'p_con3', cat: 'practice', dim: 'consistency', phases: [2], min: 10,
      title: 'Remove one obstacle tonight',
      detail: 'Whatever you plan to do tomorrow, remove one step of friction now. Clothes out, app deleted, bag packed, phone charging in the hall. Tomorrow-you is not more disciplined, only better equipped.' },
    { id: 'p_con4', cat: 'practice', dim: 'consistency', phases: [2,3], min: 5,
      title: 'Never miss twice',
      detail: 'The rule that matters is not perfection, it is the bounce. If yesterday was a miss, today is non-negotiable. Write "never miss twice" somewhere you will see it this week.' },
    { id: 'p_con5', cat: 'practice', dim: 'consistency', phases: [3], min: 10,
      title: 'Plan for the derailer',
      detail: 'You already named what knocks you off. Write the if-then now: "If I am exhausted, then I do the two-minute version." Decide once, in calm, so you are not deciding in the moment.' },
    { id: 'p_con6', cat: 'practice', dim: 'consistency', phases: [3,4], min: 10,
      title: 'Audit the week',
      detail: 'Look at the last seven days honestly. What did you actually do versus what you intended? No judgement — you are looking for the pattern in when it slips, not for a verdict.' },

    /* ---------- PRACTICE: vitality ---------- */
    { id: 'p_vit1', cat: 'practice', dim: 'vitality', phases: [1], min: 10,
      title: 'Fix the wake time first',
      detail: 'Same wake time tomorrow as today, regardless of when you sleep. Wake time anchors the whole rhythm; bedtime follows it, not the other way round.' },
    { id: 'p_vit2', cat: 'practice', dim: 'vitality', phases: [1], min: 10,
      title: 'Daylight in the first hour',
      detail: 'Ten minutes of outdoor light within an hour of waking, even on a grey day. It is the single strongest lever on sleep and mood that costs nothing.' },
    { id: 'p_vit3', cat: 'practice', dim: 'vitality', phases: [1,2], min: 10,
      title: 'Eat something with protein before ten',
      detail: 'If you skip breakfast and crash by eleven, that is not a character flaw. Eat properly early. Emotional regulation on an empty tank is much harder than it needs to be.' },
    { id: 'p_vit4', cat: 'practice', dim: 'vitality', phases: [2], min: 20,
      title: 'Move until you are breathing hard',
      detail: 'Twenty minutes where your breathing changes. Run, hills, stairs, weights, anything. Not for looks — for the nervous system.' },
    { id: 'p_vit5', cat: 'practice', dim: 'vitality', phases: [2,3], min: 10,
      title: 'Name the numbing habit',
      detail: 'Notice the thing you reach for when you do not want to feel something. Do not stop it today. Just catch it and write down what you were avoiding thirty seconds before.' },
    { id: 'p_vit6', cat: 'practice', dim: 'vitality', phases: [3], min: 10,
      title: 'Wind-down that is not a screen',
      detail: 'The last thirty minutes before bed: no feed, no messages. Book, shower, stretch, music. Your sleep quality tomorrow is decided tonight.' },
    { id: 'p_vit7', cat: 'practice', dim: 'vitality', phases: [3,4], min: 20,
      title: 'Train something measurable',
      detail: 'Pick one number you can improve over eight weeks: press-ups, a run time, a lift, a distance. Progress you can count does something for the mind that vague effort never will.' },

    /* ---------- PRACTICE: purpose ---------- */
    { id: 'p_pur1', cat: 'practice', dim: 'purpose', phases: [1], min: 10,
      title: 'Audit where the hours go',
      detail: 'Write out yesterday hour by hour, honestly, screen time included. You cannot redirect a life you have not looked at.' },
    { id: 'p_pur2', cat: 'practice', dim: 'purpose', phases: [1,2], min: 10,
      title: 'One thing that is yours',
      detail: 'Name something you would do even if nobody knew. If nothing comes, pick something you were interested in at fourteen and try it for ten minutes.' },
    { id: 'p_pur3', cat: 'practice', dim: 'purpose', phases: [2], min: 15,
      title: 'Write the year',
      detail: 'One page, dated a year from today, describing an ordinary Tuesday in a life you would be proud of. Present tense. Specific. Small details, not achievements.' },
    { id: 'p_pur4', cat: 'practice', dim: 'purpose', phases: [2,3], min: 10,
      title: 'Cut one thing',
      detail: 'Find one commitment, subscription or obligation that gives you nothing. End it this week. Direction is as much subtraction as addition.' },
    { id: 'p_pur5', cat: 'practice', dim: 'purpose', phases: [3,4], min: 15,
      title: 'Take one step nobody asked you to take',
      detail: 'One concrete action toward the thing you said was yours. Send the email, book the session, buy the tool, make the call. Momentum comes from motion, not the reverse.' },

    /* ---------- PRACTICE: connection ---------- */
    { id: 'p_cnn1', cat: 'practice', dim: 'connection', phases: [1], min: 10,
      title: 'Map your people',
      detail: 'List everyone you could call at 2am, and everyone you have not spoken to in six months but would like to. Look at the two lists. That is your real support structure.' },
    { id: 'p_cnn2', cat: 'practice', dim: 'connection', phases: [1,2], min: 10,
      title: 'Tell one person the truth',
      detail: 'Say one honest sentence about how you actually are to somebody who is not your partner or ex. Not the full download — one true sentence. See if the sky holds.' },
    { id: 'p_cnn3', cat: 'practice', dim: 'connection', phases: [2], min: 15,
      title: 'Make an actual plan',
      detail: 'Not "we should catch up". A day, a time, a place. Send it today. Most friendships die of ambiguity, not conflict.' },
    { id: 'p_cnn4', cat: 'practice', dim: 'connection', phases: [2,3], min: 15,
      title: 'Be useful to someone',
      detail: 'Do one concrete thing for another person that costs you something and that you cannot be repaid for. This does more for self-worth than any amount of thinking about self-worth.' },
    { id: 'p_cnn5', cat: 'practice', dim: 'connection', phases: [3,4], min: 15,
      title: 'Show up somewhere in person',
      detail: 'A class, a game, a group, a bar with a regular crowd. Same place, same time, weekly. Community is repetition plus proximity — there is no shortcut.' },
    { id: 'p_cnn6', cat: 'practice', dim: 'connection', phases: [3,4], min: 10,
      title: 'Ask someone for something',
      detail: 'A favour, advice, help with a job. Small. Being the one who only gives is its own kind of distance, and people generally like being asked.' },

    /* ---------- PRACTICE: presence ---------- */
    { id: 'p_prs1', cat: 'practice', dim: 'presence', phases: [1], min: 10,
      title: 'One meal with nothing else',
      detail: 'No phone, no screen, no reading. Just the food. Notice how quickly the hand reaches for something. That reach is the thing you are working on.' },
    { id: 'p_prs2', cat: 'practice', dim: 'presence', phases: [1,2], min: 5,
      title: 'Five things',
      detail: 'Stop wherever you are and name five things you can see, four you can hear, three you can feel. Ninety seconds. It pulls you out of the loop and back into the room.' },
    { id: 'p_prs3', cat: 'practice', dim: 'presence', phases: [2], min: 10,
      title: 'Walk with no input',
      detail: 'Ten minutes walking with no podcast, no music, no phone. Let it be boring. Boredom is where your own thoughts finally get a turn.' },
    { id: 'p_prs4', cat: 'practice', dim: 'presence', phases: [2,3], min: 10,
      title: 'Single-task one hour',
      detail: 'One hour, one thing, no tabs. Whatever it is. Attention is a trainable capacity and it has been getting worse without you agreeing to it.' },
    { id: 'p_prs5', cat: 'practice', dim: 'presence', phases: [3,4], min: 10,
      title: 'Notice three good things',
      detail: 'At the end of today, write three specific ordinary good things. Specific: "the light at 4pm on the kitchen wall", not "nice weather". Specificity is what makes this work.' },
    { id: 'p_prs6', cat: 'practice', dim: 'presence', phases: [3,4], min: 10,
      title: 'Put the phone down mid-conversation',
      detail: 'When someone starts talking, put your phone face down and out of reach. Every time. People can tell, and it is the cheapest form of respect there is.' },

    /* ---------- REACH: relationship-specific, from phase 2 onward ---------- */
    { id: 'r_rel1', cat: 'reach', dim: 'ownership', phases: [2], min: 15, tags: ['relationship'],
      title: 'Write the amends letter you will not send',
      detail: 'Name what you did, its effect, and what you are changing. No requests, no defence, no plea. Do not send it. It is for you, to find out whether your accountability is real or performed.' },
    { id: 'r_rel2', cat: 'reach', dim: 'regulation', phases: [2,3], min: 10, tags: ['relationship'],
      title: 'Respect the space, today included',
      detail: 'If they asked for room, today is another day you give it. No message, no check of their profile, no note passed through a friend. Space honoured is the only evidence of change they can see from a distance.' },
    { id: 'r_rel3', cat: 'reach', dim: 'ownership', phases: [3], min: 15, tags: ['relationship'],
      title: 'Separate what you want from what you are owed',
      detail: 'Write what you want to happen. Then write, plainly, that they are allowed to want something different. Both, in your own handwriting. Wanting someone back and accepting they may not come are not contradictory — holding both is the actual work.' },
    { id: 'r_rel4', cat: 'reach', dim: 'communication', phases: [3], min: 15, tags: ['relationship'],
      title: 'Draft the honest, low-pressure message',
      detail: 'If and only if contact is welcome: short, warm, no pressure, no ask, no case for yourself, no reference to the future. Draft it. Leave it 24 hours. Send it only if it still reads as generous rather than strategic.' },
    { id: 'r_rel5', cat: 'reach', dim: 'worth', phases: [3,4], min: 15, tags: ['relationship'],
      title: 'Build the life that does not depend on the answer',
      detail: 'Do one thing today that makes your life better whatever they decide. Not as a tactic — as a fact. If this only works when they come back, it was never growth.' },
    { id: 'r_rel6', cat: 'reach', dim: 'communication', phases: [4], min: 15, tags: ['relationship'],
      title: 'Practise hearing no',
      detail: 'Write out what you would say if they said a final no. Something you could say with dignity and mean. Being able to hear no without collapse is what makes a yes worth anything.' },
    { id: 'r_rel7', cat: 'reach', dim: 'ownership', phases: [4], min: 15, tags: ['relationship'],
      title: 'Read back your own words',
      detail: 'Go to your answer about what you want to be true of you in a year, whatever happens. Read it. Then write whether the last weeks have moved you toward it.' },

    /* ---------- REACH: general ---------- */
    { id: 'r_gen1', cat: 'reach', dim: 'connection', phases: [2,3,4], min: 10,
      title: 'Repair something small',
      detail: 'A friendship that went quiet for no reason. Send the awkward message. "I have been rubbish at keeping in touch and I have been thinking about you" works almost every time.' },
    { id: 'r_gen2', cat: 'reach', dim: 'communication', phases: [2,3,4], min: 15,
      title: 'Ask someone what you are like',
      detail: 'Ask one person you trust: "what is the thing about me that is hardest to deal with?" Then say thank you and nothing else. Sit with it for a day before you respond.' },
    { id: 'r_gen3', cat: 'reach', dim: 'worth', phases: [2,3,4], min: 15,
      title: 'Do the thing you would avoid',
      detail: 'One thing today you have been putting off because it is socially uncomfortable. The call, the query, the correction. Courage is a practised skill, not a personality trait.' },
    { id: 'r_gen4', cat: 'reach', dim: 'purpose', phases: [3,4], min: 20,
      title: 'Show someone the work',
      detail: 'Whatever your own thing is, let one person see it. Unfinished is fine. Things kept entirely private tend to quietly die.' },

    /* ---------- REFLECT: written prompts, phase-weighted ---------- */
    { id: 'j_p1a', cat: 'reflect', dim: 'ownership', phases: [1], min: 10,
      title: 'Write it down without editing',
      detail: 'What actually happened? Not the version for other people — the one with your part in it. Ten minutes, no stopping to make it sound better.' },
    { id: 'j_p1b', cat: 'reflect', dim: 'regulation', phases: [1], min: 10,
      title: 'What am I most afraid of here?',
      detail: 'Under the anger or the urgency, there is usually a fear. Name it as plainly as you can. Fear that is named loses most of its steering power.' },
    { id: 'j_p1c', cat: 'reflect', dim: 'worth', phases: [1], min: 10,
      title: 'Who was I before this?',
      detail: 'Describe yourself two years ago. What did you have then that you have let go of? Some of it is worth going back for.' },
    { id: 'j_p2a', cat: 'reflect', dim: 'ownership', phases: [2], min: 10,
      title: 'The pattern, not the incident',
      detail: 'Where else in your life does this same behaviour show up? Work, family, friends. If it is only in one relationship it is a situation. If it is everywhere it is a pattern, and patterns are the thing you can actually change.' },
    { id: 'j_p2b', cat: 'reflect', dim: 'communication', phases: [2], min: 10,
      title: 'What do I do instead of saying it?',
      detail: 'When you cannot say something directly, what comes out sideways instead? Sulking, sarcasm, over-helping, going quiet, getting busy. Name your substitute.' },
    { id: 'j_p2c', cat: 'reflect', dim: 'consistency', phases: [2], min: 10,
      title: 'Where did I stop last time?',
      detail: 'Think of the last time you tried to change something and did not finish. What was happening in the week you dropped it? That week is the one to plan for.' },
    { id: 'j_p3a', cat: 'reflect', dim: 'worth', phases: [3], min: 10,
      title: 'What is different now?',
      detail: 'Not what you have learned — what you have done differently. Specific moments. If you cannot name three, that is useful information rather than a failure.' },
    { id: 'j_p3b', cat: 'reflect', dim: 'purpose', phases: [3], min: 10,
      title: 'What would I do with this year if the outcome were already decided?',
      detail: 'Assume you cannot influence the thing you most want to influence. What would you build instead? That answer is usually the thing worth building either way.' },
    { id: 'j_p3c', cat: 'reflect', dim: 'connection', phases: [3], min: 10,
      title: 'Who have I been carrying this alone with?',
      detail: 'Who knows the real version of what you are going through? If the honest answer is nobody, write down who could.' },
    { id: 'j_p4a', cat: 'reflect', dim: 'ownership', phases: [4], min: 15,
      title: 'The letter to yourself twelve weeks ago',
      detail: 'Write to the version of you who started this. What do you know now that they did not? Be honest about what has not changed as well.' },
    { id: 'j_p4b', cat: 'reflect', dim: 'purpose', phases: [4], min: 15,
      title: 'What keeps going after this ends?',
      detail: 'Of everything in these twelve weeks, what stays permanently? Pick three things and commit to them without an end date.' },

    /* ---------- PRACTICE: partnership ---------- */
    { id: 'p_par1', cat: 'practice', dim: 'partnership', phases: [1], min: 5, tags: ['partner'],
      title: 'Just count the bids',
      detail: 'Do not fix anything today. Only count: how many times did they reach for your attention, and how many times did you turn toward it, away from it, or against it? Write the two numbers down. Most people are shocked by the gap, and the shock is the useful part.' },
    { id: 'p_par2', cat: 'practice', dim: 'partnership', phases: [1], min: 5, tags: ['partner'],
      title: 'Six seconds, twice',
      detail: 'A proper hello and a proper goodbye. Six seconds each — long enough that it is not a peck or a grunt. It sounds contrived until you have done it for a fortnight and notice the day has a different shape. Adapt it for a doorstep handover if that is where you are.' },
    { id: 'p_par3', cat: 'practice', dim: 'partnership', phases: [1,2], min: 10, tags: ['partner'],
      title: 'Complaint, not criticism',
      detail: 'A complaint is about an event: "the bins did not go out and I was annoyed." A criticism is about a person: "you never think about anyone but yourself." The first is workable, the second puts them on trial. Today, catch one criticism before it leaves your mouth and rebuild it as a complaint.' },
    { id: 'p_par4', cat: 'practice', dim: 'partnership', phases: [2], min: 10, tags: ['partner'],
      title: 'Find your horseman',
      detail: 'Criticism, contempt, defensiveness, stonewalling. One of the four is your default under pressure. Work out which by looking at your last three arguments, and write down the specific move — the tone, the phrase, the walking out. You cannot stop a habit you have never named.' },
    { id: 'p_par5', cat: 'practice', dim: 'partnership', phases: [2], min: 10, tags: ['partner'],
      title: 'Accept influence, once',
      detail: 'Find one thing today where you let their view actually change your decision — not a concession you are keeping score of, an actual change of mind. Say so out loud: "you were right, I have changed my mind." Refusing influence is one of the most reliable predictors of a relationship going badly.' },
    { id: 'p_par6', cat: 'practice', dim: 'partnership', phases: [2], min: 10, tags: ['partner'],
      title: 'The first three minutes',
      detail: 'How a difficult conversation opens largely decides how it ends. Today, start one with: what you feel, the specific situation, and what you need. "I am worried about Saturday. Can we sort the plan tonight?" No preamble, no case for the prosecution.' },
    { id: 'p_par7', cat: 'practice', dim: 'partnership', phases: [2,3], min: 10, tags: ['partner'],
      title: 'Name the cycle, not the person',
      detail: 'Most couples have one loop: one presses, the other retreats, and each move causes the other. It is nobody\'s fault and everybody\'s problem. Today, describe the loop out loud without blame in it — "when I push, you go quiet, and then I push harder." Naming the cycle is what lets you both stand next to it rather than inside it.' },
    { id: 'p_par8', cat: 'practice', dim: 'partnership', phases: [2,3], min: 5, tags: ['partner'],
      title: 'Make a repair attempt, badly',
      detail: 'A repair attempt is anything that tries to lower the temperature mid-row: a bad joke, a hand on the arm, "hang on, I am doing the thing again." It does not have to be elegant. What matters is whether it gets made at all, and whether the other person lets it land. Make one today, and let one land.' },
    { id: 'p_par9', cat: 'practice', dim: 'partnership', phases: [3], min: 10, tags: ['partner'],
      title: 'The question under the argument',
      detail: 'Arguments about the dishwasher are rarely about the dishwasher. Underneath is usually one question: am I important to you? Today, answer that question rather than the surface one, and watch what happens to the surface one.' },
    { id: 'p_par10', cat: 'practice', dim: 'partnership', phases: [3], min: 10, tags: ['partner'],
      title: 'Count your ratio',
      detail: 'Stable couples run at roughly five positive exchanges to every negative one — not in the fights, in the ordinary hours. Tally yours for a day. If you are underwater, the fix is not fewer arguments, it is more small good moments.' },
    { id: 'p_par11', cat: 'practice', dim: 'partnership', phases: [3,4], min: 15, tags: ['partner'],
      title: 'The problem you will never solve',
      detail: 'In Gottman\'s research most of what couples argue about is perpetual — rooted in personality and never fully resolved. The job is not to solve it but to be able to talk about it without damage. Pick yours and have ten minutes of dialogue with no attempt to fix it.' },
    { id: 'p_par12', cat: 'practice', dim: 'partnership', phases: [4], min: 15, tags: ['partner'],
      title: 'One ritual, protected',
      detail: 'Something small and regular that survives a bad week: coffee before the house wakes, a walk on Sunday, the last twenty minutes of the day with the TV off. Choose it, name it out loud as a thing you both do, and defend it.' },

    /* ---------- PRACTICE: parenting ---------- */
    { id: 'p_kid1', cat: 'practice', dim: 'partnership', phases: [1,2,3], min: 15, tags: ['parenting'],
      title: 'Write out the invisible list',
      detail: 'Not the chores — the remembering. Who knows when the forms are due, which shoes no longer fit, who has fallen out with whom, when the appointment is. Write the whole list. This is the load that does not show up in a rota and quietly wrecks more partnerships than housework does.' },
    { id: 'p_kid2', cat: 'practice', dim: 'partnership', phases: [2,3], min: 15, tags: ['parenting'],
      title: 'Take one thing off the list, permanently',
      detail: 'Pick one item from the invisible list and own it completely — not "helping with it", owning it, including the remembering. Say which one you are taking. The word "permanently" is the part that counts.' },
    { id: 'p_kid3', cat: 'practice', dim: 'partnership', phases: [2,3], min: 10, tags: ['parenting'],
      title: 'Let them see the repair',
      detail: 'What harms children is not witnessing conflict, it is witnessing conflict that never visibly resolves. If they saw the row, let them see the making-up — a short, plain "we were cross, we sorted it out, it was not about you." You are teaching them what repair looks like, and they will use it for the rest of their lives.' },
    { id: 'p_kid4', cat: 'practice', dim: 'partnership', phases: [2,3,4], min: 20, tags: ['parenting', 'partner'],
      title: 'Twenty minutes that is not admin',
      detail: 'Time with your partner that is not a handover, a rota or a discussion about the children. Twenty minutes. After kids arrive most couples talk only as co-managers and then wonder where the relationship went — this is the antidote, and it has to be scheduled because it will never happen otherwise.' },
    { id: 'p_kid5', cat: 'practice', dim: 'presence', phases: [3,4], min: 20, tags: ['parenting'],
      title: 'One-on-one with each of them',
      detail: 'Each child separately, no siblings, no logistics. A walk, a shop, a drive. Children behave differently and say different things when they are not competing for airtime, and you will learn something you did not know.' },
    { id: 'p_kid6', cat: 'practice', dim: 'regulation', phases: [2,3,4], min: 10, tags: ['parenting'],
      title: 'The handover that does not leak',
      detail: 'If you hand the children over, do it flat and warm regardless of what you feel about the other adult. No sighs, no comments, no information passed through a child. Children read handovers like weather, and a clean one is a gift you can give them today.' },
    { id: 'p_kid7', cat: 'practice', dim: 'ownership', phases: [3,4], min: 5, tags: ['parenting'],
      title: 'Say the good thing about their other parent',
      detail: 'Once today, say something genuinely positive about the children\'s other parent, in front of them, meaning it. A child hears criticism of a parent as criticism of half of themselves. This is one of the clearest findings there is, and it costs you nothing but pride.' },

    /* ---------- REACH: partner and family ---------- */
    { id: 'r_par1', cat: 'reach', dim: 'partnership', phases: [2,3,4], min: 10, tags: ['partner'],
      title: 'Ask what would make the biggest difference',
      detail: 'Ask them: "what is one thing I could do differently that would make the biggest difference to you?" Then do not defend, explain or negotiate. Say thank you. Do the thing.' },
    { id: 'r_par2', cat: 'reach', dim: 'partnership', phases: [3,4], min: 15, tags: ['partner'],
      title: 'The specific apology, out loud',
      detail: 'Not for everything — for one thing. Name it, name its effect, no "but", no explanation of what you meant. Then stop talking and let it be uncomfortable. A general apology asks to be forgiven for being yourself; a specific one is the only kind that lands.' },
    { id: 'r_kid1', cat: 'reach', dim: 'connection', phases: [2,3,4], min: 10, tags: ['parenting'],
      title: 'Ask your child a real question',

/* Mendday — the reading.
 *
 * Short lessons drawn from mainstream couples and family research, mostly
 * John Gottman's observational work and Sue Johnson's Emotionally Focused
 * Therapy, plus the parenting literature on conflict and repair.
 *
 * Tracks decide who sees what: 'partner', 'parenting', 'self'.
 * Order matters — these build on each other, so they are delivered in
 * sequence rather than shuffled.
 *
 * This is educational material, not therapy, and couples work genuinely
 * needs both people. What is here is the half that is yours.
 */

    {
      id: 'l_bids', track: 'partner', min: 4,

      dek: 'Bids for connection, and the three things you can do with one.',

        'A bid is any small reach for attention. "Look at this." A sigh. A hand on your shoulder. A comment about something on the news that you have no interest in. They happen dozens of times a day and almost all of them look like nothing.',
        'There are three things you can do with a bid. Turn toward it — look up, answer, engage. Turn away from it — miss it, stay on your phone, say nothing. Or turn against it — snap, dismiss, make it a nuisance.',
        'In Gottman\'s observational work, how often partners turn toward each other\'s bids was one of the strongest markers separating couples who lasted from those who did not. Not how they argued. Not how compatible they were. The ordinary, boring turning-toward.',
        'The reason it matters so much is that it accumulates invisibly. Nobody leaves because of one ignored comment. They leave after several thousand of them, at which point the story they tell is "we drifted apart", which is the phrase people use when they cannot see what actually happened.'

      practice: 'Today, catch one bid you would normally have missed and turn toward it properly. Put the phone down first.'

        'Adult attachment research describes how people behave in close relationships using two fairly stable dials rather than types. One is how much you fear being abandoned. The other is how uncomfortable closeness and dependence make you.',
        'Low on both is what gets called secure: able to be close without losing yourself, able to be apart without assuming the worst. High on the first dial and distance feels like danger, so you press — text again, seek reassurance, need to resolve it tonight. High on the second and closeness raises your temperature, so you manage it with distance: stay busy, stay reasonable, handle it alone.',
        'Neither is a character flaw and neither is fixed. They are learned strategies that made sense somewhere, and they update — slowly, through experience rather than insight.',
        'The reason this matters more than almost anything else here: the two patterns lock together. A person who presses and a person who retreats will reliably produce each other, each convinced they are responding reasonably to the other. Recognising your dial does not excuse your half. It tells you which half is yours.',
        'One caution. Knowing your pattern is useful as a description of what you tend to do. It is not a licence — "I am avoidant" is an explanation, not a permission slip, and the same goes the other way.'

    {

      title: 'The four that do the damage',
      dek: 'Criticism, contempt, defensiveness, stonewalling — and what goes in their place.',
      body: [
        'Gottman named four patterns that show up reliably when a relationship is in trouble. Most people have a default one. Knowing yours is more useful than knowing all four.',
        '<strong>Criticism</strong> attacks the person rather than the problem. "The bins did not go out" is a complaint. "You never think about anyone but yourself" is a criticism. The first can be solved; the second puts them on trial. The replacement is a complaint plus a request.',
        '<strong>Contempt</strong> is criticism from above — sarcasm, eye-rolling, mockery, the tone. It communicates disgust, and it is the single most corrosive of the four. There is no gentle version of it. The replacement is not politeness, it is deliberately building back respect you have let slide.',
        '<strong>Defensiveness</strong> is meeting a complaint with your innocence. "I did do it, you just did not notice." It reads as refusing to hear them. The replacement is accepting some part of it, even a small part, before anything else.',
        '<strong>Stonewalling</strong> is going blank, leaving, shutting down. It is usually not contempt but flooding — your body has hit an overload and stopped processing. The replacement is not pushing through; it is saying "I need twenty minutes" and actually coming back.'

      practice: 'Work out which of the four is yours. Look at your last three arguments and name the specific move — the tone, the phrase, the walking out.'

        'When conflict escalates past a certain point, your heart rate climbs and your body switches into threat mode. Above roughly 100 beats a minute, the parts of you that do nuance, memory and generosity are substantially offline. You are not being difficult; you have stopped being able to process.',
        'This is why arguments past a certain heat go nowhere. Neither of you is really there. Anything agreed in that state tends not to survive the night.',
        'The way out has two halves, and most people only do the first. The first half is stopping: "I am flooded, I need twenty minutes." The second half is what you do with the twenty minutes — and if you spend it rehearsing your case, you will come back more flooded than you left.',
        'Self-soothing means genuinely dropping the arousal: walk, breathe out longer than you breathe in, do something with your hands. Twenty minutes is roughly the physiological minimum. And you must come back, at the time you said. A break that becomes an exit is just stonewalling with a better excuse.'

        'Happy couples are not the ones who avoid conflict. They are the ones who get back faster. A repair attempt is anything that tries to lower the temperature while it is still hot: a clumsy joke, a hand on the arm, "hang on, I am doing the thing again", "can we start that bit over".',
        'Repair attempts are usually inelegant, and that does not matter. What matters is whether one gets made, and whether the other person lets it land. A rejected repair attempt is one of the more reliable danger signs there is.',

        'In Gottman\'s work, roughly two-thirds of what couples argue about is perpetual — rooted in durable differences of personality, values or need. Tidiness. Sociability. Money. How much closeness is the right amount. These do not get solved, and treating them as solvable is what turns them poisonous.',

      plan: null,
      quizSection: 0,
      log: {},        // dayKey -> { tasks:{id:true}, done, mood, energy, note }
      journal: [],    // { date, taskId, title, text, ts }
      checkins: [],   // { date, scores }
      lessonsRead: {},// lessonId -> dayKey first read
      recheckDraft: {},// a re-score in progress, so closing the app mid-way loses nothing
      adjustments: [],// changes laid over the plan, from conversations
      marks: {},      // milestones already counted, so none is counted twice

/* Mendday — milestone counting.

          '<button class="btn btn-ghost" data-act="lesson" data-lesson="' + esc(l.id) + '" ' +
            'style="margin-top:12px">' + (open ? 'Close' : 'Read it') + '</button>' +
        '</div>' +
      '</div>';

  function taskCard(t, done, key) {
    if (t.cat === 'learn') return lessonCard(t, done, key);
    var isWriting = t.cat === 'reflect';
    var chipClass = t.cat === 'anchor' ? ' chip-anchor' : (isWriting ? ' chip-reflect' : '');
    var text = isWriting ? MS.store.journalFor(key, t.id) : '';
    return '' +
      '<div class="task' + (done ? ' done' : '') + '">' +
        '<button class="tick" data-act="tick" data-task="' + esc(t.id) + '" ' +
          'aria-label="Mark done" aria-pressed="' + done + '">✓</button>' +
        '<div class="task-body">' +
          '<div class="task-meta">' +
            '<span class="chip' + chipClass + '">' + esc(t.cat) + '</span>' +
            '<span class="chip">' + esc(MS.DIMENSIONS[t.dim].short) + '</span>' +
            '<span class="chip">' + t.min + ' min</span>' +
          '</div>' +
          '<div class="task-title">' + esc(t.title) + '</div>' +
          '<div class="task-detail">' + esc(t.detail) + '</div>' +
          (isWriting
            ? '<div class="task-journal">' +
                '<textarea data-input="journal" data-task="' + esc(t.id) + '" ' +
                  'data-title="' + esc(t.title) + '" data-day="' + key + '" ' +
                  'placeholder="Write it here. It saves as you type and stays on this device.">' +
                  esc(text) + '</textarea>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* ---------- plan ---------- */

  U.plan = function (st) {
    var plan = st.plan;
    var info = MS.dayInfo(plan, MS.dayKey());
    var D = MS.DIMENSIONS;
    return page('<div class="wrap">' +
      '<p class="eyebrow">The plan</p>' +
      '<h2 style="margin:8px 0 16px">Twelve weeks, four phases</h2>' +
      '<div class="stats">' +
        stat(info.beforeStart ? '—' : Math.min(info.dayNumber, MS.TOTAL_DAYS), 'of 84 days') +
        stat(info.phaseN, 'phase') +
        stat(plan.minutes + 'm', 'per day') +
      '</div>' +
      '<hr class="divider">' +
      '<p class="eyebrow">Your keystones</p>' +
      '<p class="muted small" style="margin:8px 0 16px">Everything below is weighted toward these two. ' +
      'They were the lowest-scoring things you also said you cared about.</p>' +
      plan.keystones.map(function (k) {
        return '<div class="card card-tight"><h3>' + esc(D[k].label) + '</h3>' +
          '<p class="muted small" style="margin:6px 0 0">' + esc(MS.DIM_READ[k]) + '</p></div>';
      }).join('') +
      (plan.attachment ? U.attachmentCard(plan.attachment) : '') +
      (plan.relationship ? U.relationshipNote(st) : '') +
      '<hr class="divider">' +
      '<div style="margin-top:16px">' + U.phaseList(plan, info.phaseN) + '</div>' +
    '</div>');
  };

  function stat(v, label) {
    return '<div class="stat"><b>' + esc(v) + '</b><span>' + esc(label) + '</span></div>';
  }

  /* ---------- progress ---------- */

  U.progress = function (st) {
    var plan = st.plan;
    var stats = MS.completionStats(st.log, plan, st.adjustments);
    var streak = MS.streak(st.log, plan);
    var info = MS.dayInfo(plan, MS.dayKey());
    var latest = st.checkins.length ? st.checkins[st.checkins.length - 1].scores : null;

    // A re-score is due at the end of each phase.
    var phasesDone = Math.floor(Math.max(0, info.index) / MS.PHASE_DAYS);
    var due = phasesDone > st.checkins.length;

    var moods = Object.keys(st.log)
      .sort()
      .filter(function (k) { return st.log[k].mood; })
      .slice(-28);

    return page('<div class="wrap">' +
      '<p class="eyebrow">Progress</p>' +
      '<h2 style="margin:8px 0 18px">What you have actually done</h2>' +
      '<div class="stats">' +
        stat(streak, 'day streak') +
        stat(stats.rate + '%', 'tasks done') +
        stat(stats.daysActive, 'active days') +
      '</div>' +

      (due
        ? '<div class="note" style="margin-top:18px"><strong>Phase ' + phasesDone + ' is done — time to re-score.</strong> ' +
          'Nine questions, same as the ones from the quiz. It takes two minutes and it is the only way to see ' +
          'whether any of this is moving.' +
          '<div style="margin-top:12px"><button class="btn" data-act="recheck">Re-score now</button></div></div>'
        : '') +

      '<hr class="divider">' +
      '<p class="eyebrow">Your nine dimensions</p>' +
      '<p class="muted small" style="margin:8px 0 16px">' +
        (latest
          ? 'Bars show your latest re-score. The vertical mark is where you started.'
          : 'Where you started. Re-score at the end of each phase to see this move.') +
      '</p>' +
      '<div class="bars">' + U.bars(latest || plan.scores, plan.keystones, latest ? plan.scores : null, plan.dims) + '</div>' +

      (moods.length > 2 ? moodChart(st, moods) : '') +

      '<hr class="divider">' +
      '<p class="eyebrow">The arc</p>' +
      '<div style="margin-top:16px">' + U.phaseList(plan, info.phaseN) + '</div>' +
    '</div>');
  };

  /* A small inline SVG — mood and energy over the last few weeks. */
  function moodChart(st, keys) {
    var w = 320, h = 90, pad = 6;
    function line(field, color) {
      var pts = keys.map(function (k, i) {
        var v = st.log[k][field] || 3;
        var x = pad + (i / Math.max(1, keys.length - 1)) * (w - pad * 2);
        var y = h - pad - ((v - 1) / 4) * (h - pad * 2);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      return '<polyline points="' + pts + '" fill="none" stroke="' + color +
        '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    return '' +
      '<hr class="divider">' +
      '<p class="eyebrow">Head and energy · last ' + keys.length + ' logged days</p>' +
      '<div class="scroll-x" style="margin-top:14px">' +
        '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" ' +
          'preserveAspectRatio="none" role="img" aria-label="Mood and energy over time">' +
          line('mood', 'var(--accent)') + line('energy', 'var(--teal)') +
        '</svg>' +
      '</div>' +
      '<div class="row small dim" style="margin-top:8px;gap:18px">' +
        '<span><b style="color:var(--accent)">—</b> head</span>' +
        '<span><b style="color:var(--teal)">—</b> energy</span>' +
      '</div>';
  }

  /* ---------- re-score ---------- */

  /* Two questions per dimension. One would snap every score to a quintile,
   * which reads as precision the answer does not have next to the four-to-six
   * question average from the original quiz. */
  function recheckQuestions() {
    var byDim = {};
    MS.DIM_KEYS.forEach(function (d) { byDim[d] = []; });
    MS.QUIZ.forEach(function (s) {
      s.questions.forEach(function (q) {
        if (q.type === 'scale' && byDim[q.dim]) byDim[q.dim].push(q);
      });
    });
    var out = [];
    MS.DIM_KEYS.forEach(function (d) {
      // Prefer plainly-worded questions over the reverse-scored ones.
      var pool = byDim[d].filter(function (q) { return !q.reverse; });
      if (pool.length < 2) pool = pool.concat(byDim[d].filter(function (q) { return q.reverse; }));
      out = out.concat(pool.slice(0, 2));
    });
    return out;
  }

  U.recheck = function (st) {
    var qs = recheckQuestions();
    var pending = st.recheckDraft || {};
    var answeredCount = qs.filter(function (q) { return pending[q.id]; }).length;
    var ready = answeredCount === qs.length;

    return page('<div class="wrap">' +
      '<p class="eyebrow">Re-score</p>' +
      '<h2 style="margin:8px 0 6px">Same questions, today\'s answers</h2>' +
      '<p class="muted">Answer as of the last two weeks, not as of your best day. ' +
      qs.length + ' questions, about two minutes.</p>' +
      '<div class="progressbar" style="margin-top:16px"><i style="width:' +
        Math.round((answeredCount / qs.length) * 100) + '%"></i></div>' +
      qs.map(function (q) {
        var v = pending[q.id];
        var out = '<div class="q"><div class="q-text">' + esc(q.text) + '</div><div class="scale">';
        for (var n = 1; n <= 5; n++) {
          out += '<button type="button" data-act="recheck-set" data-q="' + q.id + '" data-v="' + n + '"' +
            ' aria-pressed="' + (v === n) + '"><b>' + n + '</b><span>' + esc(q.labels[n - 1]) + '</span></button>';
        }
        return out + '</div></div>';
      }).join('') +
      '<div class="btn-row" style="margin-top:26px">' +
        '<button class="btn btn-ghost" data-act="recheck-cancel">Cancel</button>' +
        '<button class="btn" data-act="recheck-save"' + (ready ? '' : ' disabled') + '>Save re-score</button>' +
      '</div>' +
      (ready ? '' : '<p class="dim tiny" style="margin-top:10px">' +
        (qs.length - answeredCount) + ' left.</p>') +
    '</div>');
  };

  /* ---------- the reading library ---------- */

  U.learn = function (st) {
    var plan = st.plan;
    var list = MS.lessonPlan(plan);
    var read = st.lessonsRead || {};
    var info = MS.dayInfo(plan, MS.dayKey());
    var readCount = list.filter(function (l) { return read[l.id]; }).length;

    if (!list.length) {
      return page('<div class="wrap"><p class="eyebrow">Reading</p>' +
        '<h2 style="margin:8px 0 14px">Nothing here yet</h2>' +
        '<p class="muted">The reading follows the tracks your plan is running. ' +
        'Yours does not include the partner or parenting material — retake the quiz from ' +
        'the You tab if that has changed.</p></div>');
    }

    var body = list.map(function (l, i) {
      var day = i * 3 + 1;
      var unlocked = info.beforeStart ? false : info.dayNumber >= day;
      var open = MS.openLesson === l.id;
      return '<div class="lesson-row' + (open ? ' open' : '') + '">' +
        '<button class="lesson-head" data-act="lesson" data-lesson="' + esc(l.id) + '">' +
          '<span class="lesson-day">' + (read[l.id] ? '✓' : (unlocked ? '·' : '')) + '</span>' +
          '<span class="lesson-main">' +
            '<span class="lesson-title">' + esc(l.title) + '</span>' +
            '<span class="lesson-dek">' + esc(l.dek) + '</span>' +
          '</span>' +
          '<span class="lesson-meta">' + (unlocked ? l.min + ' min' : 'day ' + day) + '</span>' +
        '</button>' +
        (open ? U.lessonBody(l) : '') +
      '</div>';
    }).join('');

    return page('<div class="wrap">' +
      '<p class="eyebrow">Reading</p>' +
      '<h2 style="margin:8px 0 12px">' + readCount + ' of ' + list.length + ' read</h2>' +
      '<p class="muted small">Short pieces from the research on couples and families — ' +
      'mostly Gottman\'s observational work and Emotionally Focused Therapy. One arrives ' +
      'on your Today screen every third day, but you can read ahead.</p>' +
      '<div class="note" style="margin:18px 0 22px">' +
        '<strong>This is educational material, not therapy.</strong> Couples work needs both ' +
        'people; what an app can do is your half. Where there is fear, coercion or violence ' +
        'in a relationship, standard couples advice does not apply and some of it makes things ' +
        'worse — that needs a professional service, not a task list.' +
      '</div>' +
      '<div class="lessons">' + body + '</div>' +
    '</div>');
  };

  /* ---------- journal ---------- */

  U.journal = function (st) {
    var entries = st.journal
      .filter(function (j) { return j.text && j.text.trim(); })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var notes = Object.keys(st.log)
      .filter(function (k) { return st.log[k].note && st.log[k].note.trim(); })
      .sort().reverse();

    var body = '';
    if (!entries.length && !notes.length) {
      body = '<p class="muted">Nothing yet. The written tasks on your Today screen land here, ' +
        'along with your end-of-day lines. In eight weeks this is the part you will actually want to read back.</p>';
    } else {
      body = entries.map(function (j) {
        return '<div class="jentry">' +
          '<div class="spread"><strong class="small">' + esc(j.title) + '</strong>' +
          '<span class="dim tiny">' + esc(longDate(j.date)) + '</span></div>' +
          '<pre>' + esc(j.text) + '</pre></div>';
      }).join('');
      if (notes.length) {
        body += '<hr class="divider"><p class="eyebrow">End-of-day lines</p>' +
          notes.map(function (k) {
            return '<div class="jentry"><div class="spread">' +
              '<span class="dim tiny">' + esc(longDate(k)) + '</span></div>' +
              '<pre>' + esc(st.log[k].note) + '</pre></div>';

    return page('<div class="wrap">' +
      '<p class="eyebrow">Journal</p>' +
      '<h2 style="margin:8px 0 18px">' + entries.length + ' written ' +

      '<div class="card">' +

              '</p>' +
            '</div>'
          : '') +
        '<p class="dim tiny" style="margin:14px 0 0">There is no iCloud API for the web, so nothing here ' +
        'syncs on its own on a phone — and a version that did would mean your journal living on ' +

      '</div>' +

      '<div class="card">' +
        '<p class="eyebrow">Copy as text</p>' +
        '<p class="muted small" style="margin:10px 0 14px">The same data on your clipboard, ' +

        '<p class="eyebrow">Start again</p>' +

        'Your journal and daily log are kept.</p>' +
        '<div class="btn-row" style="flex-wrap:wrap">' +
          '<button class="btn btn-ghost" data-act="retake">Retake the quiz</button>' +

  /* Shown only where counting is actually deployed — a self-hosted or offline
   * copy has nothing to disclose and no switch to offer. */
  U.insightCard = function (st) {
    if (!MS.insight.configured()) return '';
    var on = MS.insight.enabled();
    var st_ = MS.store.get();
    var off = st_.settings.insight === false;
    return '<div class="card">' +
      '<p class="eyebrow">Counting</p>' +
      '<p class="muted small" style="margin:10px 0 6px">Seven moments get counted — ' +
      'starting the quiz, finishing it, opening the app from your home screen, and ' +
      'reaching day 7, 30 and 84. Each one is a number going up by one, once ever, ' +
      'on this device.</p>' +
      '<p class="muted small" style="margin:0 0 14px"><strong>Nothing else is sent.</strong> ' +
      'No account, no identifier, no scores, and nothing you have written. It is ' +
      'there so I can tell whether anyone gets anywhere with this.</p>' +
      '<div class="btn-row">' +
        '<button class="btn ' + (off ? 'btn-ghost' : '') + '" data-act="insight" data-v="on">On</button>' +
        '<button class="btn ' + (off ? '' : 'btn-ghost') + '" data-act="insight" data-v="off">Off</button>' +
      '</div>' +
      (on ? '' : '<p class="dim tiny" style="margin:10px 0 0">' +
        (off ? 'Off — nothing is being sent.'
             : 'Your browser asks not to be tracked, so nothing is being sent.') + '</p>') +
    '</div>';

  U.adjustmentsCard = function (st) {
    var all = (st.adjustments || []).slice().sort(function (a, b) {
      return a.from < b.from ? 1 : -1;
    });
    if (!all.length) return '';
    var t = MS.dayKey();
    return '<div class="card">' +
      '<p class="eyebrow">Changes from conversations</p>' +
      '<p class="muted small" style="margin:10px 0 14px">Adjustments laid over your plan. ' +
      'The twelve weeks underneath are untouched, and removing one puts that day back as it was.</p>' +
      all.map(function (a) {
        var live = (a.to || a.from) >= t;
        var span = a.from === (a.to || a.from) ? a.from : a.from + ' to ' + a.to;
        return '<div class="jentry">' +
          '<div class="spread">' +
            '<strong class="small">' + esc(a.kind) + (live ? '' : ' (past)') + '</strong>' +
            '<span class="dim tiny">' + esc(span) + '</span>' +
          '</div>' +
          '<p class="muted small" style="margin:4px 0 0">' + esc(a.reason || '') + '</p>' +
          (a.text ? '<p class="small" style="margin:4px 0 0">' + esc(a.text) + '</p>' : '') +
          '<button class="btn btn-quiet" style="padding:6px 0" data-act="drop-adjustment" ' +
            'data-id="' + esc(a.id) + '">Undo this</button>' +
        '</div>';
      }).join('') +
    '</div>';
